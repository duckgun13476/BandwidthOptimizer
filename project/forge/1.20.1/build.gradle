plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'me.modmuss50.mod-publish-plugin' version '1.0.0'
}

apply plugin: 'org.spongepowered.mixin'
apply from: rootProject.file('gradle/bo-property-loader.gradle')
apply from: rootProject.file('test.gradle')

ext.bo_publish_artifact_task_name = 'reobfJar'
ext.bo_publish_artifact_relative_path = "build/libs/${package_name}-${mod_version}-forge-${minecraft_version}.jar"
ext.bo_publish_loader_id = 'forge'
ext.bo_publish_curseforge_loaders = ['Forge']
ext.bo_publish_modrinth_loaders = ['forge']

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'mixin.debug', 'true'
            property 'mixin.debug.export', 'true'
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDirectory project.file('run/client')
            configureBandwidthOptimizerClientRun(project, delegate)
        }

        server {
            workingDirectory project.file('run/server')
            configureBandwidthOptimizerServerRun(project, delegate)
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory rootProject.file('run-data')
            args '--mod', mod_id, '--all', '--output', rootProject.file('src/generated/resources/'), '--existing', project.file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets {
    main {
        java.srcDir rootProject.file('common/src/main/java')
        java.srcDir project.file('src/main/java')
        resources.srcDir rootProject.file('common/src/main/resources')
        resources.srcDir project.file('src/main/resources')
        resources.srcDir rootProject.file('src/generated/resources')
    }
    test {
        java.srcDir rootProject.file('common/src/test/java')
        java.srcDir project.file('src/test/java')
        resources.srcDir project.file('src/test/resources')
    }
}

repositories {
    maven {
        name = "PinkCatsMaven"
        url = uri("https://logistics.aisaveworld.tech/d/share/maven/torque")
        content {
            includeGroup "com.pinkcats.torque"
        }
    }
}

ext.bo_zstd_jni_version = '1.5.7-7'
ext.bo_torque_embed_notation = "com.pinkcats.torque:TorqueAPI-${minecraft_version}-forge:${torque_api_version}"
ext.bo_create_runtime_mod_dir = rootProject.file('COMPAT/XineLada/create-min-server/mods')
ext.bo_mapped_create_runtime_mods = [
        "${System.getProperty('user.home')}/.gradle/caches/forge_gradle/deobf_dependencies/com/simibubi/create/create-1.20.1/6.0.6-150_mapped_official_1.20.1/create-1.20.1-6.0.6-150_mapped_official_1.20.1-slim.jar",
        "${System.getProperty('user.home')}/.gradle/caches/forge_gradle/deobf_dependencies/dev/engine-room/flywheel/flywheel-forge-1.20.1/1.0.4_mapped_official_1.20.1/flywheel-forge-1.20.1-1.0.4_mapped_official_1.20.1.jar",
        "${System.getProperty('user.home')}/.gradle/caches/forge_gradle/deobf_dependencies/net/createmod/ponder/Ponder-Forge-1.20.1/1.0.80_mapped_official_1.20.1/Ponder-Forge-1.20.1-1.0.80_mapped_official_1.20.1.jar",
        "${System.getProperty('user.home')}/.gradle/caches/forge_gradle/deobf_dependencies/com/tterrag/registrate/Registrate/MC1.20-1.3.11_mapped_official_1.20.1/Registrate-MC1.20-1.3.11_mapped_official_1.20.1.jar",
        "${System.getProperty('user.home')}/.gradle/caches/forge_gradle/deobf_dependencies/curse/maven/curios-309927/6418456_mapped_official_1.20.1/curios-309927-6418456_mapped_official_1.20.1.jar",
]
apply from: rootProject.file('gradle/torque-embed-modern.gradle')

configurations {
    embeddedRuntimeLibs {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

def embeddedRuntimeLibsOutputDir = layout.buildDirectory.dir('generated/boEmbeddedRuntimeLibs')

tasks.register('prepareEmbeddedRuntimeLibs', Copy) {
    from(configurations.embeddedRuntimeLibs)
    into(embeddedRuntimeLibsOutputDir.map { it.dir('META-INF/bandwidthoptimizer/libs') })
}

sourceSets.main.resources.srcDir embeddedRuntimeLibsOutputDir

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly("com.pinkcats.torque:TorqueAPI-layer-api:${torque_api_version}") {
        changing = true
    }
    implementation fg.deobf("com.pinkcats.torque:TorqueAPI-${minecraft_version}-forge:${torque_api_version}") {
        changing = true
        transitive = false
    }
    compileOnly "com.github.luben:zstd-jni:${bo_zstd_jni_version}"
    testRuntimeOnly "com.github.luben:zstd-jni:${bo_zstd_jni_version}"
    embeddedRuntimeLibs "com.github.luben:zstd-jni:${bo_zstd_jni_version}"
    runtimeOnly "io.github.llamalad7:mixinextras-forge:0.4.1"

    // Local Create test runtime.
    bo_mapped_create_runtime_mods.each { String jarPath ->
        File jarFile = file(jarPath)
        if (jarFile.isFile()) {
            runtimeOnly files(jarFile)
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('prepareEmbeddedRuntimeLibs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             torque_api_version  : torque_api_version,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    dependsOn tasks.named('prepareEmbeddedRuntimeLibs')
    archiveFileName = "${package_name}-${mod_version}-forge-${minecraft_version}.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    "MixinConfigs"            : "${mod_id}.mixins.json"])
    }

    from(embeddedRuntimeLibsOutputDir)

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

apply from: rootProject.file('gradle/bo-publishing.gradle')
