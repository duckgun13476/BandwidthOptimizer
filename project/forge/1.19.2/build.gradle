plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

def targetMinecraftVersion = '1.19.2'
def targetForgeVersion = '43.5.0'

minecraft {
    mappings channel: mapping_channel, version: targetMinecraftVersion
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory rootProject.file('run')
            property 'mixin.debug', 'true'
            property 'mixin.debug.export', 'true'
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDirectory rootProject.file('run/client-1.19.2')
        }

        server {
            workingDirectory rootProject.file('run/server-1.19.2')
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory rootProject.file('run-data-1.19.2')
            args '--mod', mod_id, '--all', '--output', rootProject.file('src/generated/resources/'), '--existing', rootProject.file('project/forge/1.20.1/src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets {
    main {
        java.srcDir rootProject.file('common/src/main/java')
        java.srcDir rootProject.file('project/forge/1.20.1/src/main/java')
        resources.srcDir rootProject.file('common/src/main/resources')
        resources.srcDir rootProject.file('project/forge/1.20.1/src/main/resources')
        resources.srcDir rootProject.file('src/generated/resources')
    }
    test {
        java.setSrcDirs([])
        resources.setSrcDirs([])
    }
}

repositories {
    maven {
        name = "PinkCatsLocal"
        url = uri("C:/F/Maven")
    }
}

configurations {
    bundledLibs
}

configurations.configureEach {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

dependencies {
    String zstdJniVersion = '1.5.7-7'

    minecraft "net.minecraftforge:forge:${targetMinecraftVersion}-${targetForgeVersion}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly("com.pinkcats.torque:TorqueAPI-layer-api:${torque_api_version}") {
        changing = true
    }
    implementation fg.deobf("com.pinkcats.torque:TorqueAPI-1.19.2-forge:${torque_api_version}") {
        changing = true
        transitive = false
    }
    implementation "com.github.luben:zstd-jni:${zstdJniVersion}"
    minecraftLibrary "com.github.luben:zstd-jni:${zstdJniVersion}"
    bundledLibs "com.github.luben:zstd-jni:${zstdJniVersion}"
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    var replaceProperties = [minecraft_version   : targetMinecraftVersion, minecraft_version_range: '[1.19.2,1.20)',
                             forge_version       : targetForgeVersion, forge_version_range: '[43,)',
                             loader_version_range: '[43,)',
                             torque_api_version  : torque_api_version,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    archiveFileName = "${package_name}-${mod_version}-forge-${targetMinecraftVersion}.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    "MixinConfigs"            : "${mod_id}.mixins.json"])
    }

    from {
        configurations.bundledLibs.collect { dependency ->
            zipTree(dependency)
        }
    } {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
