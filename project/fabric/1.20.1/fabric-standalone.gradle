import net.fabricmc.loom.LoomGradlePlugin
import net.darkhax.curseforgegradle.CurseForgeGradlePlugin
import me.modmuss50.mpp.MppPlugin

buildscript {
    repositories {
        maven {
            name = 'GradlePluginPortal'
            url = 'https://plugins.gradle.org/m2/'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
    }
    dependencies {
        classpath 'net.fabricmc:fabric-loom:1.10.5'
        classpath 'net.darkhax.curseforgegradle:CurseForgeGradle:1.1.28'
        classpath 'me.modmuss50:mod-publish-plugin:1.0.0'
    }
}

apply plugin: 'idea'
apply plugin: LoomGradlePlugin
apply plugin: CurseForgeGradlePlugin
apply plugin: MppPlugin

apply from: file('../../../gradle/bo-property-loader.gradle')
apply from: file('../../../test.gradle')

group = mod_group_id
version = mod_version

ext.bo_publish_artifact_task_name = 'remapJar'
ext.bo_publish_artifact_relative_path = "build/libs/${package_name}-${mod_version}-fabric-1.20.1.jar"
ext.bo_publish_loader_id = 'fabric'
ext.bo_publish_curseforge_loaders = ['Fabric']
ext.bo_publish_modrinth_loaders = ['fabric']
ext.bo_publish_required_dependencies = ['fabric-api']
ext.minecraft_version = '1.20.1'

base {
    archivesName = "${package_name}-fabric-1.20.1"
}

repositories {
    maven {
        name = 'PinkCatsLocal'
        url = uri('C:/F/Maven')
    }
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

configurations {
    bundledLibs
}

configurations.configureEach {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

dependencies {
    String zstdJniVersion = '1.5.7-7'

    minecraft 'com.mojang:minecraft:1.20.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.17.2'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.6+1.20.1'
    modImplementation("com.pinkcats.torque:TorqueAPI-1.20.1-fabric:${torque_api_version}") {
        changing = true
    }
    include("com.pinkcats.torque:TorqueAPI-1.20.1-fabric:${torque_api_version}")
    compileOnly("com.pinkcats.torque:TorqueAPI-layer-api:${torque_api_version}") {
        changing = true
    }
    implementation "com.github.luben:zstd-jni:${zstdJniVersion}"
    include "com.github.luben:zstd-jni:${zstdJniVersion}"
    bundledLibs "com.github.luben:zstd-jni:${zstdJniVersion}"
}

sourceSets {
    main {
        java.srcDir '../../../common/src/main/java'
        java.srcDir 'src/main/java'
        resources.srcDir '../../../common/src/main/resources'
        resources.srcDir 'src/main/resources'
        resources.exclude 'META-INF/mods.toml'
    }
    test {
        java.srcDir '../../../project/forge/1.20.1/src/test/java'
        resources.srcDir '../../../project/forge/1.20.1/src/test/resources'
    }
}

loom {
    runs {
        client {
            client()
            runDir = 'run/client'
            configureBandwidthOptimizerClientRun(project, delegate)
        }
        server {
            server()
            runDir = 'run/server'
            configureBandwidthOptimizerServerRun(project, delegate)
        }
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    var replaceProperties = [
            mod_id            : mod_id,
            mod_name          : mod_name,
            mod_version       : mod_version,
            mod_authors       : mod_authors,
            mod_description   : mod_description,
            mod_license       : mod_license,
            loader_version    : '0.17.2',
            minecraft_version : '1.20.1',
            fabric_api_version: '0.92.6+1.20.1'
    ]
    inputs.properties replaceProperties
    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
                "MixinConfigs": "bandwidthoptimizer.mixins.json"
        ])
    }
    from {
        configurations.bundledLibs.collect { dependency -> zipTree(dependency) }
    } {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }
}

tasks.named('remapJar').configure {
    archiveFileName = "${package_name}-${mod_version}-fabric-1.20.1.jar"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

apply from: file('../../../gradle/bo-publishing.gradle')
apply from: file('../../../gradle/bo-fabric-publishing-verify.gradle')
