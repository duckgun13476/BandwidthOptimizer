tasks.register('runAll') {
    group = 'application'
    description = 'Starts NeoForge 1.21.1 server and client from this subproject, then verifies four-way jsonl traffic.'
    dependsOn(tasks.named('testClasses'))

    doLast {
        project.ext.boRequireExplicitVersionRunAllTaskRequest.call(project, 'runAll')
        String osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
        boolean isWindows = osName.contains('windows')
        File rootDirFile = rootProject.projectDir
        File projectDirFile = project.projectDir
        String wrapperPath = new File(rootDirFile, isWindows ? 'gradlew.bat' : 'gradlew').absolutePath
        long observeSeconds = project.ext.boReadRunAllLongProperty.call(project, 'boRunAllObserveSeconds', 0L)
        long settleMillis = project.ext.boReadRunAllLongProperty.call(project, 'boRunAllSettleMillis', 3000L)
        long settleTimeoutMillis = project.ext.boReadRunAllLongProperty.call(project, 'boRunAllSettleTimeoutMillis', 15000L)

        File serverDir = project.file('run/server')
        File clientDir = project.file('run/client')
        File serverOutputDir = project.ext.boServerOutputRoot.call(project)
        File clientOutputDir = project.ext.boClientOutputRoot.call(project)
        File serverTaskLog = project.file('run/runall-server-task.log')
        File clientTaskLog = project.file('run/runall-client-task.log')
        File serverSendJsonl = new File(serverOutputDir, 'send.jsonl')
        File serverReceiveJsonl = new File(serverOutputDir, 'receive.jsonl')
        File clientSendJsonl = new File(clientOutputDir, 'send.jsonl')
        File clientReceiveJsonl = new File(clientOutputDir, 'receive.jsonl')
        File serverChunkHotspotStats = new File(serverOutputDir, 'chunk-hotspot-stats.properties')
        File clientChunkHotspotStats = new File(clientOutputDir, 'chunk-hotspot-stats.properties')
        File serverLoginMarker = new File(serverOutputDir, 'bo-runall-player-logged-in.marker')
        File serverPathCompletedMarker = new File(serverOutputDir, 'bo-runall-chunk-hotspot-path-completed.marker')
        File serverProperties = project.file('run/server/server.properties')
        File serverOpsFile = project.file('run/server/ops.json')

        stopExistingRunAllProcesses(project, projectDirFile, isWindows)
        sleep(3000)

        project.ext.boClearRunAllProbeFiles.call([
                serverTaskLog,
                clientTaskLog,
                serverSendJsonl,
                serverReceiveJsonl,
                clientSendJsonl,
                clientReceiveJsonl,
                serverChunkHotspotStats,
                clientChunkHotspotStats,
                serverLoginMarker,
                serverPathCompletedMarker
        ])

        configureRunAllServerProperties(serverProperties)
        configureRunAllServerOperators(serverOpsFile)

        Process serverProcess = null
        Process clientProcess = null
        try {
            println 'runAll: starting NeoForge 1.21.1 local server.'
            serverProcess = startNeoForgeRunTaskProcess(rootDirFile, projectDirFile, isWindows, wrapperPath, 'runServer', buildRunAllSharedGradleArgs(project), serverTaskLog, 'runServer')
            project.ext.boWaitForLogMarker.call(
                    serverTaskLog,
                    ['Done ('],
                    ['BUILD FAILED', 'Failed to start the minecraft server', 'Address already in use', 'Crash report saved to'],
                    240000L,
                    'NeoForge runAll server startup'
            )

            List<String> clientGradleArgs = buildExperientAutoConnectGradleArgs(project, '127.0.0.1:25565', 'BO NeoForge RunAll Local', 20L)
            println 'runAll: server is ready, starting NeoForge 1.21.1 client.'
            clientProcess = startNeoForgeRunTaskProcess(rootDirFile, projectDirFile, isWindows, wrapperPath, 'runClient', clientGradleArgs, clientTaskLog, 'runClient')
            project.ext.boWaitForLogMarker.call(
                    clientTaskLog,
                    ['Connecting to 127.0.0.1, 25565', 'Connecting to 127.0.0.1:25565'],
                    ['Failed to connect to the server', 'Connection refused', 'Internal Exception', 'Reached max attempts'],
                    240000L,
                    'NeoForge runAll client connect'
            )

            project.ext.boWaitForFourWayCapturedTraffic.call(clientSendJsonl, clientReceiveJsonl, serverSendJsonl, serverReceiveJsonl, 240000L)
            println "runAll: four-way jsonl started. server=${serverDir.absolutePath}, client=${clientDir.absolutePath}"

            if (observeSeconds > 0L) {
                sleep(observeSeconds * 1000L)
                stopRunAllServerProcesses(project, projectDirFile, isWindows)
                if (serverProcess.isAlive()) {
                    serverProcess.waitFor(30L, TimeUnit.SECONDS)
                }
                if (clientProcess.isAlive()) {
                    clientProcess.waitFor(15L, TimeUnit.SECONDS)
                }
                forceStopRunAllProcesses(project, projectDirFile, isWindows, [serverProcess, clientProcess])
                project.ext.boWaitForFilesToSettle.call(
                        [serverSendJsonl, serverReceiveJsonl, clientSendJsonl, clientReceiveJsonl, serverChunkHotspotStats, clientChunkHotspotStats],
                        settleMillis,
                        settleTimeoutMillis
                )
                if (shouldRunNeoForgeRunAllCompare(project)) {
                    javaexec {
                        classpath = sourceSets.test.runtimeClasspath
                        mainClass = 'com.PinkCats.bandwidthoptimizer.test.ChannelJsonlCompareMain'
                        systemProperty 'bandwidthoptimizer.compare.allowTrailingPacketStreamFrames', 'true'
                    }
                } else {
                    println 'runAll: 跳过 NeoForge jsonl compare，因为当前是多次退出重进场景。'
                }
                println 'runAll: NeoForge 1.21.1 runAll completed.'
                return
            }

            if ((project.findProperty('boExperientChunkHotspotPathEnabled') ?: 'false').toString().toBoolean()) {
                project.ext.boWaitForMarkerFile.call(serverPathCompletedMarker, 300000L, 'NeoForge runAll chunk-hotspot path completion')
                forceStopRunAllProcesses(project, projectDirFile, isWindows, [serverProcess, clientProcess])
            } else {
                clientProcess.waitFor()
                project.ext.boWaitForFilesToSettle.call([clientSendJsonl, serverReceiveJsonl], settleMillis, settleTimeoutMillis)
                stopRunAllServerProcesses(project, projectDirFile, isWindows)
                if (serverProcess.isAlive()) {
                    serverProcess.waitFor(30L, TimeUnit.SECONDS)
                }
            }
            project.ext.boWaitForFilesToSettle.call([clientSendJsonl, serverReceiveJsonl], settleMillis, settleTimeoutMillis)
            project.ext.boWaitForFilesToSettle.call(
                    [serverSendJsonl, serverReceiveJsonl, clientSendJsonl, clientReceiveJsonl, serverChunkHotspotStats, clientChunkHotspotStats],
                    settleMillis,
                    settleTimeoutMillis
            )
            if (shouldRunNeoForgeRunAllCompare(project)) {
                javaexec {
                    classpath = sourceSets.test.runtimeClasspath
                    mainClass = 'com.PinkCats.bandwidthoptimizer.test.ChannelJsonlCompareMain'
                    systemProperty 'bandwidthoptimizer.compare.allowTrailingPacketStreamFrames', 'true'
                }
            } else {
                println 'runAll: 跳过 NeoForge jsonl compare，因为当前是多次退出重进场景。'
            }
            println 'runAll: NeoForge 1.21.1 runAll completed.'
        } finally {
            forceStopRunAllProcesses(project, projectDirFile, isWindows, [serverProcess, clientProcess])
        }
    }
}
