def appendOptionalRunAllProperty(List<String> args, Project projectRef, String propertyName) {
    if (projectRef.hasProperty(propertyName)) {
        args.add("-P${propertyName}=${projectRef.property(propertyName).toString()}")
    }
}

def buildRunAllSharedGradleArgs(Project projectRef) {
    List<String> args = ['--console=plain', '-PboExperientEnabled=true']
    [
            'boExperientServerCommand',
            'boExperientServerCommandDelayTicks',
            'boExperimentalTransport',
            'boExperimentalChunkHotspotTransport',
            'boExperientChunkHotspotPathEnabled',
            'boExperientChunkHotspotPathStopAfterSection',
            'boExperientChunkHotspotPathStopAfterBlockEntity',
            'boExperientChunkHotspotPathTwoPointReuseMode',
            'boExperientChunkHotspotPathBoundaryHopMode',
            'boExperientChunkHotspotPathDimensionHopMode',
            'boExperientChunkHotspotPathRangeBounceMode',
            'boExperientRunAllMarkerExit',
            'boExperientWatchBoundaryRefreshPatchEnabled',
            'boExperientChunkHotspotPathRangeStartX',
            'boExperientChunkHotspotPathRangeStartY',
            'boExperientChunkHotspotPathRangeStartZ',
            'boExperientChunkHotspotPathRangeEndX',
            'boExperientChunkHotspotPathRangeEndY',
            'boExperientChunkHotspotPathRangeEndZ',
            'boExperientChunkHotspotPathRangeStepBlocks',
            'boExperientChunkHotspotPathRangeRoundTrips',
            'boDebugDiagnose',
            'boChunkDiagnosticOutputsEnabled',
            'boTransportMappingEnabled',
            'boTransportZstdEnabled',
            'boTransportBatchEnabled',
            'boTransportBatchWindowMillis',
            'boTransportPacketIdMappingEnabled',
            'boTransportTelemetryDumpFileName',
            'boChannelJsonlCaptureEnabled',
            'boChunkGlobalStoreBudgetBytes',
            'boChunkGlobalStoreMaxVersionsPerChunk',
            'boChunkWatchBoundaryReuseMaxDeltaPackets',
            'boChunkWatchBoundaryReuseMaxDeltaBytesRatio',
            'boClientChunkCacheMaxMemoryMb',
            'boClientChunkCacheRecycleTriggerFreeMb'
    ].each { String propertyName ->
        appendOptionalRunAllProperty(args, projectRef, propertyName)
    }
    if (!projectRef.hasProperty('boChannelJsonlCaptureEnabled')) {
        args.add('-PboChannelJsonlCaptureEnabled=true')
    }
    if (!projectRef.hasProperty('boDebugDiagnose')) {
        args.add('-PboDebugDiagnose=true')
    }
    if (!projectRef.hasProperty('boExperientRunAllMarkerExit')) {
        args.add('-PboExperientRunAllMarkerExit=true')
    }
    return args
}

def buildExperientAutoConnectGradleArgs(Project projectRef, String address, String serverName, long delayTicks) {
    List<String> args = buildRunAllSharedGradleArgs(projectRef)
    args.add("-PboExperientAutoConnectAddress=${address}")
    args.add("-PboExperientAutoConnectName=${serverName}")
    args.add("-PboExperientAutoConnectDelayTicks=${delayTicks}")
    appendOptionalRunAllProperty(args, projectRef, 'boExperientAutoConnectMaxAttempts')
    appendOptionalRunAllProperty(args, projectRef, 'boExperientAutoConnectRetryDelayTicks')
    return args
}

def readRunAllLongProperty(Project projectRef, String propertyName, long defaultValue) {
    if (!projectRef.hasProperty(propertyName)) {
        return defaultValue
    }
    String rawValue = projectRef.property(propertyName).toString().trim()
    if (rawValue.isEmpty()) {
        return defaultValue
    }
    long parsedValue = Long.parseLong(rawValue)
    if (parsedValue < 0L) {
        throw new GradleException("${propertyName} must be >= 0")
    }
    return parsedValue
}

// 判断 runAll 是否是带当前版本项目路径显式调用，避免根目录 ./gradlew runAll 触发多版本聚合。
def isExplicitVersionRunAllTaskRequest(Project projectRef, String taskName) {
    List<String> requestedTasks = gradle.startParameter.taskNames.collect { it.toString() }
    String qualifiedTaskPath = "${projectRef.path}:${taskName}"
    boolean requestedByQualifiedPath = requestedTasks.any { String requestedTask ->
        requestedTask == qualifiedTaskPath
    }
    File requestedProjectDir = gradle.startParameter.projectDir
    boolean requestedByProjectDirectory = requestedTasks.any { String requestedTask ->
        requestedTask == taskName
    } && requestedProjectDir != null && requestedProjectDir.canonicalFile == projectRef.projectDir.canonicalFile
    return requestedByQualifiedPath || requestedByProjectDirectory
}

// runAll divide by version
def requireExplicitVersionRunAllTaskRequest(Project projectRef, String taskName) {
    if (!isExplicitVersionRunAllTaskRequest(projectRef, taskName)) {
        throw new GradleException("${taskName} 已拆分到版本项目内，请使用 ./gradlew ${projectRef.path}:${taskName}")
    }
}

def startNeoForgeRunTaskProcess(File rootDirFile, File projectDirFile, boolean isWindows, String wrapperPath, String taskName, List<String> extraGradleArgs, File outputFile, String consoleLabel) {
    List<String> command = []
    if (isWindows) {
        command.addAll(['cmd', '/c', wrapperPath])
    } else {
        command.add(wrapperPath)
    }
    command.addAll(['-p', projectDirFile.absolutePath])
    if (extraGradleArgs != null) {
        command.addAll(extraGradleArgs.findAll { it != null && !it.isBlank() })
    }
    command.add(taskName)

    ProcessBuilder builder = new ProcessBuilder(command.collect { it.toString() })
    builder.directory(rootDirFile)
    builder.redirectErrorStream(true)
    Process process = builder.start()
    streamRunTaskOutputToConsole(process, outputFile, consoleLabel)
    return process
}

def streamRunTaskOutputToConsole(Process process, File outputFile, String consoleLabel) {
    String safeConsoleLabel = (consoleLabel == null || consoleLabel.isBlank()) ? 'run-task' : consoleLabel
    Thread.startDaemon("neoforge-runall-log-pump-${safeConsoleLabel}") {
        BufferedReader reader = new BufferedReader(new InputStreamReader(process.inputStream, StandardCharsets.UTF_8))
        BufferedWriter writer = new BufferedWriter(new OutputStreamWriter(new FileOutputStream(outputFile, true), StandardCharsets.UTF_8))
        try {
            String line
            while ((line = reader.readLine()) != null) {
                synchronized (System.out) {
                    System.out.println("[${safeConsoleLabel}] ${line}")
                }
                writer.write(line)
                writer.newLine()
                writer.flush()
            }
        } finally {
            try {
                reader.close()
            } catch (IOException ignored) {
            }
            try {
                writer.close()
            } catch (IOException ignored) {
            }
        }
    }
}

def waitForLogMarker(File logFile, List<String> successMarkers, List<String> failureMarkers, long timeoutMillis, String stageLabel) {
    long deadline = System.currentTimeMillis() + timeoutMillis
    while (System.currentTimeMillis() < deadline) {
        if (logFile.exists()) {
            String logText = logFile.getText('UTF-8')
            if (failureMarkers.any { String marker -> logText.contains(marker) }) {
                throw new GradleException("${stageLabel} failed. Check ${logFile.absolutePath}")
            }
            if (successMarkers.any { String marker -> logText.contains(marker) }) {
                return
            }
        }
        sleep(1000)
    }
    throw new GradleException("${stageLabel} timed out. Check ${logFile.absolutePath}")
}

def waitForFourWayCapturedTraffic(File clientSendJsonl, File clientReceiveJsonl, File serverSendJsonl, File serverReceiveJsonl, long timeoutMillis) {
    long deadline = System.currentTimeMillis() + timeoutMillis
    while (System.currentTimeMillis() < deadline) {
        if ((clientSendJsonl.exists() ? clientSendJsonl.length() : 0L) > 0L
                && (clientReceiveJsonl.exists() ? clientReceiveJsonl.length() : 0L) > 0L
                && (serverSendJsonl.exists() ? serverSendJsonl.length() : 0L) > 0L
                && (serverReceiveJsonl.exists() ? serverReceiveJsonl.length() : 0L) > 0L) {
            return
        }
        sleep(1000)
    }
    throw new GradleException('runAll timed out before all four jsonl streams were written.')
}

def waitForRunAllMarker(File markerFile, long timeoutMillis, String stageLabel) {
    long deadline = System.currentTimeMillis() + timeoutMillis
    while (System.currentTimeMillis() < deadline) {
        if (markerFile.exists() && markerFile.length() > 0L) {
            return
        }
        sleep(1000)
    }
    throw new GradleException("${stageLabel} timed out. Missing ${markerFile.absolutePath}")
}

def waitForFilesToSettle(List<File> files, long stableMillis, long timeoutMillis) {
    if (files.isEmpty() || stableMillis <= 0L) {
        return
    }
    Map<String, Long> lastSnapshot = files.collectEntries { File file ->
        [(file.absolutePath): file.exists() ? file.length() : -1L]
    }
    long stableSince = System.currentTimeMillis()
    long deadline = System.currentTimeMillis() + timeoutMillis
    while (System.currentTimeMillis() < deadline) {
        sleep(500)
        Map<String, Long> currentSnapshot = files.collectEntries { File file ->
            [(file.absolutePath): file.exists() ? file.length() : -1L]
        }
        if (currentSnapshot == lastSnapshot) {
            if (System.currentTimeMillis() - stableSince >= stableMillis) {
                return
            }
        } else {
            lastSnapshot = currentSnapshot
            stableSince = System.currentTimeMillis()
        }
    }
    throw new GradleException('runAll timed out while waiting for output files to settle.')
}

