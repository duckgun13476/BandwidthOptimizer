        'com/PinkCats/bandwidthoptimizer/command/ClientHudCommand.java',
        'com/PinkCats/bandwidthoptimizer/server/stat/ServerBandwidthStatsLifecycleHooks.java',
        'com/PinkCats/bandwidthoptimizer/server/stat/ServerBandwidthStatsHudSync.java',
        'com/PinkCats/bandwidthoptimizer/channel/mes/ChannelFrameJsonlLogger.java',
        'com/PinkCats/bandwidthoptimizer/compat/minecraft/ForgeModLoadingContextCompat.java',
        'com/PinkCats/bandwidthoptimizer/report/ChunkBoundaryBandwidthRecorder.java',
        'com/PinkCats/bandwidthoptimizer/chunk/budget/ChunkClientCacheBudgetManager.java',
        'com/PinkCats/bandwidthoptimizer/report/ChannelTransportPacketRankReportWriter.java',
        'com/PinkCats/bandwidthoptimizer/report/ChannelTransportCompressionReportWriter.java',
        'com/PinkCats/bandwidthoptimizer/report/ChannelTransportPacketRankCaptureManager.java',
        'com/PinkCats/bandwidthoptimizer/report/ChannelTransportCompressionCaptureManager.java',
        'com/PinkCats/bandwidthoptimizer/client/hud/BandwidthOptimizerHudOverlay.java',
        'com/PinkCats/bandwidthoptimizer/channel/algorithm/zstd/ZstdRuntimeSupport.java',
        'com/PinkCats/bandwidthoptimizer/chunk/verify/ChunkHotspotStats.java',
        'com/PinkCats/bandwidthoptimizer/client/config/ClientChunkCacheConfig.java',
        'com/PinkCats/bandwidthoptimizer/experient/ExperientAutoConnectController.java',
        'com/PinkCats/bandwidthoptimizer/experient/ExperientChunkHotspotPathController.java',
        'com/PinkCats/bandwidthoptimizer/experient/ExperientClientCaptureResetHooks.java',
        'com/PinkCats/bandwidthoptimizer/experient/ExperientRunAllProbeHooks.java',
        'com/PinkCats/bandwidthoptimizer/experient/ExperientServerCommandController.java',
        'com/PinkCats/bandwidthoptimizer/experient/ExperientWatchBoundaryRefreshPatchController.java',
        'com/PinkCats/bandwidthoptimizer/channel/ChannelTransportNetworkChannel.java',
        'com/PinkCats/bandwidthoptimizer/mixin/minecraft/ClientboundCustomPayloadPacketAccessor.java',
        'com/PinkCats/bandwidthoptimizer/mixin/minecraft/ServerboundCustomPayloadPacketAccessor.java',
        'com/PinkCats/bandwidthoptimizer/mixin/minecraft/ClientPacketListenerChunkHandleMixin.java',
