def applyOptionalNeoForgeRunProperty = { Project projectRef, def runConfig, String gradlePropertyName, String runtimePropertyName ->
    if (projectRef.hasProperty(gradlePropertyName)) {
        runConfig.systemProperty(runtimePropertyName, projectRef.property(gradlePropertyName).toString())
    }
}

def applyBooleanNeoForgeRunProperty = { Project projectRef, def runConfig, String gradlePropertyName, String runtimePropertyName ->
    if ((projectRef.findProperty(gradlePropertyName) ?: 'false').toString().toBoolean()) {
        runConfig.systemProperty(runtimePropertyName, 'true')
    }
}

