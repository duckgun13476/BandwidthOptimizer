            'boExperientChunkHotspotPathTwoPointReuseMode',
            'boExperientChunkHotspotPathBoundaryHopMode',
            'boExperientChunkHotspotPathDimensionHopMode',
            'boExperientChunkHotspotPathRangeBounceMode',
            'boExperientRunAllMarkerExit',
            'boExperientWatchBoundaryRefreshPatchEnabled',
            'boExperientChunkHotspotPathRangeStartX',
            'boExperientChunkHotspotPathRangeStartY',
            'boExperientChunkHotspotPathRangeStartZ',
            'boExperientChunkHotspotPathRangeEndX',
            'boExperientChunkHotspotPathRangeEndY',
            'boExperientChunkHotspotPathRangeEndZ',
            'boExperientChunkHotspotPathRangeStepBlocks',
            'boExperientChunkHotspotPathRangeRoundTrips',
            'boDebugDiagnose',
            'boChunkDiagnosticOutputsEnabled',
            'boTransportMappingEnabled',
            'boTransportZstdEnabled',
            'boTransportBatchEnabled',
            'boTransportBatchWindowMillis',
            'boTransportPacketIdMappingEnabled',
            'boTransportTelemetryDumpFileName',
            'boChannelJsonlCaptureEnabled',
            'boChunkGlobalStoreBudgetBytes',
            'boChunkGlobalStoreMaxVersionsPerChunk',
            'boChunkWatchBoundaryReuseMaxDeltaPackets',
            'boChunkWatchBoundaryReuseMaxDeltaBytesRatio',
            'boClientChunkCacheMaxMemoryMb',
            'boClientChunkCacheRecycleTriggerFreeMb',
            'boExperientAutoConnectRejoinCycles',
            'boExperientAutoConnectRejoinConnectedTicks',
            'boExperientAutoConnectRejoinDelayTicks',
            'boMcpAgentClientJar',
            'boMcpAgentClientPort',
            'boMcpAgentClientToken'
    ].each { String propertyName ->
        project.ext.boAppendOptionalRunAllProperty.call(args, projectRef, propertyName)
    }
    if (!projectRef.hasProperty('boChannelJsonlCaptureEnabled')) {
        args.add('-PboChannelJsonlCaptureEnabled=true')
    }
