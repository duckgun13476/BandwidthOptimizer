plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.107'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = '21.1.219'

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', rootProject.file('src/generated/resources/').absolutePath, '--existing', rootProject.file('src/main/resources/').absolutePath
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets {
    main {
        java.srcDir rootProject.file('common/src/main/java')
        java.srcDir project.file('src/main/java')
        resources.srcDir rootProject.file('common/src/main/resources')
        resources.srcDir project.file('src/main/resources')
        resources.srcDir rootProject.file('src/generated/resources')
    }
    test {
        java.srcDir rootProject.file('src/test/java')
        resources.srcDir rootProject.file('src/test/resources')
    }
}

