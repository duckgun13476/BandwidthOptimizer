    return args
}

def buildExperientAutoConnectGradleArgs(Project projectRef, String address, String serverName, long delayTicks) {
    List<String> args = buildRunAllSharedGradleArgs(projectRef)
    args.add("-PboExperientAutoConnectAddress=${address}")
    args.add("-PboExperientAutoConnectName=${serverName}")
    args.add("-PboExperientAutoConnectDelayTicks=${delayTicks}")
    project.ext.boAppendOptionalRunAllProperty.call(args, projectRef, 'boExperientAutoConnectMaxAttempts')
    project.ext.boAppendOptionalRunAllProperty.call(args, projectRef, 'boExperientAutoConnectRetryDelayTicks')
    project.ext.boAppendOptionalRunAllProperty.call(args, projectRef, 'boExperientAutoConnectRejoinCycles')
    project.ext.boAppendOptionalRunAllProperty.call(args, projectRef, 'boExperientAutoConnectRejoinConnectedTicks')
    project.ext.boAppendOptionalRunAllProperty.call(args, projectRef, 'boExperientAutoConnectRejoinDelayTicks')
    return args
}

// auto login multi times
def shouldRunNeoForgeRunAllCompare(Project projectRef) {
    if (projectRef.hasProperty('boRunAllCompareEnabled')) {
        return projectRef.property('boRunAllCompareEnabled').toString().toBoolean()
    }
    String rejoinCycles = (projectRef.findProperty('boExperientAutoConnectRejoinCycles') ?: '0').toString().trim()
    try {
        return Integer.parseInt(rejoinCycles.isEmpty() ? '0' : rejoinCycles) <= 0
    } catch (NumberFormatException ignored) {
        return true
    }
}

// runAll divide by version
def startNeoForgeRunTaskProcess(File rootDirFile, File projectDirFile, boolean isWindows, String wrapperPath, String taskName, List<String> extraGradleArgs, File outputFile, String consoleLabel) {
    List<String> command = []
    if (isWindows) {
        command.addAll(['cmd', '/c', wrapperPath])
    } else {
        command.add(wrapperPath)
    }
    command.addAll(['-p', projectDirFile.absolutePath])
    if (extraGradleArgs != null) {
        command.addAll(extraGradleArgs.findAll { it != null && !it.isBlank() })
    }
    command.add(taskName)

    ProcessBuilder builder = new ProcessBuilder(command.collect { it.toString() })
    builder.directory(rootDirFile)
    builder.redirectErrorStream(true)
    Process process = builder.start()
    project.ext.boStreamRunTaskOutputToConsole(process, outputFile, consoleLabel, 'neoforge-runall-log-pump')
    return process
}

def configureRunAllServerProperties(File propertiesFile) {
    Properties properties = new Properties()
    if (propertiesFile.exists()) {
        propertiesFile.withInputStream { input ->
            properties.load(input)
        }
    } else {
        propertiesFile.parentFile.mkdirs()
    }
    properties.setProperty('online-mode', 'false')
    properties.setProperty('enforce-secure-profile', 'false')
    properties.setProperty('server-ip', '')
    properties.setProperty('server-port', '25565')
    properties.setProperty('level-name', 'bo-runall-world')
    propertiesFile.withOutputStream { output ->
        properties.store(output, 'BandwidthOptimizer NeoForge runAll local test server')
    }
    new File(propertiesFile.parentFile, 'eula.txt').setText('eula=true' + System.lineSeparator(), StandardCharsets.UTF_8.name())
}

def configureRunAllServerOperators(File opsFile) {
    List<Map<String, Object>> opsEntries = []
    if (opsFile.exists()) {
        Object parsed = new JsonSlurper().parse(opsFile, StandardCharsets.UTF_8.name())
        if (parsed instanceof List) {
            opsEntries.addAll((List<Map<String, Object>>) parsed)
        }
    } else {
        opsFile.parentFile.mkdirs()
    }

    String offlineUuid = UUID.nameUUIDFromBytes('OfflinePlayer:Dev'.getBytes(StandardCharsets.UTF_8)).toString()
    Map<String, Object> operatorEntry = [
            uuid               : offlineUuid,
            name               : 'Dev',
            level              : 4,
            bypassesPlayerLimit: false
    ]
    int existingIndex = opsEntries.findIndexOf { Map<String, Object> entry ->
        'Dev'.equalsIgnoreCase(String.valueOf(entry.get('name')))
    }
    if (existingIndex >= 0) {
        Map<String, Object> mergedEntry = new LinkedHashMap<>(opsEntries.get(existingIndex))
        mergedEntry.putAll(operatorEntry)
        opsEntries.set(existingIndex, mergedEntry)
    } else {
        opsEntries.add(operatorEntry)
    }

    opsFile.setText(JsonOutput.prettyPrint(JsonOutput.toJson(opsEntries)) + System.lineSeparator(), StandardCharsets.UTF_8.name())
}

def stopExistingRunAllProcesses(Project projectRef, File projectDirFile, boolean isWindows) {
    if (!isWindows) {
        return
    }
    String escapedProjectDir = projectDirFile.absolutePath.replace("'", "''")
    projectRef.exec {
        commandLine 'powershell', '-NoProfile', '-Command',
                "\$targets = Get-CimInstance Win32_Process | Where-Object { \$_.CommandLine -and \$_.CommandLine -like '*${escapedProjectDir}*' -and (\$_.CommandLine -like '*gradlew.bat*runClient*' -or \$_.CommandLine -like '*gradlew.bat*runServer*' -or \$_.CommandLine -like '*net.neoforged.devlaunch*' -or \$_.CommandLine -like '*cpw.mods.bootstraplauncher*') }; \$targets | ForEach-Object { Stop-Process -Id \$_.ProcessId -Force -ErrorAction SilentlyContinue }"
        ignoreExitValue = true
    }
}

def stopRunAllServerProcesses(Project projectRef, File projectDirFile, boolean isWindows) {
    if (!isWindows) {
        return
    }
    String escapedProjectDir = projectDirFile.absolutePath.replace("'", "''")
    String escapedServerDir = new File(projectDirFile, 'run/server').absolutePath.replace("'", "''")
    projectRef.exec {
        commandLine 'powershell', '-NoProfile', '-Command',
                "\$targets = Get-CimInstance Win32_Process | Where-Object { \$_.CommandLine -and ((\$_.CommandLine -like '*${escapedProjectDir}*' -and \$_.CommandLine -like '*gradlew.bat*runServer*') -or (\$_.CommandLine -like '*${escapedServerDir}*' -and (\$_.CommandLine -like '*net.neoforged.devlaunch*' -or \$_.CommandLine -like '*cpw.mods.bootstraplauncher*'))) }; \$targets | ForEach-Object { Stop-Process -Id \$_.ProcessId -Force -ErrorAction SilentlyContinue }"
        ignoreExitValue = true
    }
}

def forceStopRunAllProcesses(Project projectRef, File projectDirFile, boolean isWindows, List<Process> processes) {
    stopExistingRunAllProcesses(projectRef, projectDirFile, isWindows)
    processes.findAll { it != null }.each { Process process ->
        if (!process.isAlive()) {
            return
        }
        process.destroy()
        process.waitFor(5L, TimeUnit.SECONDS)
        if (process.isAlive()) {
            process.destroyForcibly()
            process.waitFor(5L, TimeUnit.SECONDS)
        }
    }
}

