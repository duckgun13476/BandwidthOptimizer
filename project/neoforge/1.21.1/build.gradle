def neoforgeExcludedCommonJava = [
        'com/PinkCats/bandwidthoptimizer/channel/ChannelTransportHooks.java',
        'com/PinkCats/bandwidthoptimizer/channel/ChannelTransportBypassRankLogger.java',
        'com/PinkCats/bandwidthoptimizer/channel/algorithm/batch/ChannelTransportBatchManager.java',
        'com/PinkCats/bandwidthoptimizer/channel/capture/ChannelCaptureHooks.java',
        'com/PinkCats/bandwidthoptimizer/chunk/integration/transport/ChunkTransportControlFrameSender.java',
        'com/PinkCats/bandwidthoptimizer/chunk/packet/ClientboundPlayPacketCodec.java',
        'com/PinkCats/bandwidthoptimizer/server/stat/ServerBandwidthPersistentStats.java',
        'com/PinkCats/bandwidthoptimizer/server/stat/ServerBandwidthStatsPersistence.java'
]

tasks.named('compileJava', JavaCompile).configure {
    setSource(files(
            project.fileTree('src/main/java'),
            rootProject.fileTree('common/src/main/java') {
                exclude neoforgeExcludedCommonJava
            },
            rootProject.fileTree('src/main/java') {
                exclude neoforgeExcludedRootJava
            }
    ))
}

repositories {
    maven {
        name = 'PinkCatsLocal'
        url = uri('C:/F/Maven')
    }
}

configurations {
    bundledLibs
}

dependencies {
    String zstdJniVersion = '1.5.7-7'

    compileOnly("com.pinkcats.torque:TorqueAPI-layer-api:${torque_api_version}") {
        changing = true
    }
    implementation("com.pinkcats.torque:TorqueAPI-1.21.1-neoforge:${torque_api_version}") {
        changing = true
        transitive = false
    }
    implementation "com.github.luben:zstd-jni:${zstdJniVersion}"
    bundledLibs "com.github.luben:zstd-jni:${zstdJniVersion}"
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    var replaceProperties = [minecraft_version      : '1.21.1',
                             minecraft_version_range: '[1.21.1,1.22)',
                             neo_version            : '21.1.219',
                             neo_version_range      : '[21,)',
                             loader_version_range   : '[4,)',
                             torque_api_version     : torque_api_version,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    archiveFileName = "${package_name}-${mod_version}-neoforge-1.21.1.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(['MixinConfigs': "${mod_id}.mixins.json"])
    }

    from {
        configurations.bundledLibs.collect { dependency ->
            zipTree(dependency)
        }
    } {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
