def configureBandwidthOptimizerNeoForgeClientRun = { Project projectRef, def runConfig ->
    runConfig.systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
    runConfig.systemProperty('bandwidthoptimizer.outputDirectory', project.ext.boClientOutputRoot.call(projectRef).absolutePath)
    runConfig.systemProperty('bandwidthoptimizer.sharedOutputDirectory', project.ext.boServerOutputRoot.call(projectRef).absolutePath)
    String mcpAgentClientJarProperty = (projectRef.findProperty('boMcpAgentClientJar') ?: '').toString().trim()
    if (!mcpAgentClientJarProperty.isEmpty()) {
        File mcpAgentClientJar = projectRef.file(mcpAgentClientJarProperty)
        if (!mcpAgentClientJar.isFile()) {
            throw new GradleException("MCP client jar was not found: ${mcpAgentClientJar.absolutePath}")
        }
        String mcpAgentClientToken = (projectRef.findProperty('boMcpAgentClientToken') ?: '').toString().trim()
        if (mcpAgentClientToken.isEmpty()) {
            throw new GradleException('boMcpAgentClientToken is required when boMcpAgentClientJar is set')
        }
        TaskProvider<Copy> prepareMcpAgentClientRunMod = projectRef.tasks.register(
                'prepareMcpAgentClientRunMod',
                Copy
        ) {
            from(mcpAgentClientJar)
            into(projectRef.file('run/client/mods'))
        }
        runConfig.taskBefore(prepareMcpAgentClientRunMod)
        runConfig.systemProperty('mcp_tool_for_agent_client.bridge.enabled', 'true')
        runConfig.systemProperty('mcp_tool_for_agent_client.bridge.port', (projectRef.findProperty('boMcpAgentClientPort') ?: '18765').toString())
        runConfig.systemProperty('mcp_tool_for_agent_client.bridge.token', mcpAgentClientToken)
    }
    if ((projectRef.findProperty('boExperientEnabled') ?: 'false').toString().toBoolean()) {
        runConfig.systemProperty('bandwidthoptimizer.experient.enabled', 'true')
        if (projectRef.hasProperty('boExperientAutoConnectAddress')) {
            runConfig.systemProperty('bandwidthoptimizer.experient.autoConnectAddress', projectRef.property('boExperientAutoConnectAddress').toString())
            runConfig.systemProperty('bandwidthoptimizer.experient.autoConnectName', (projectRef.findProperty('boExperientAutoConnectName') ?: 'BandwidthOptimizer Experient').toString())
            applyOptionalNeoForgeRunProperty(projectRef, runConfig, 'boExperientAutoConnectDelayTicks', 'bandwidthoptimizer.experient.autoConnectDelayTicks')
            applyOptionalNeoForgeRunProperty(projectRef, runConfig, 'boExperientAutoConnectMaxAttempts', 'bandwidthoptimizer.experient.autoConnectMaxAttempts')
            applyOptionalNeoForgeRunProperty(projectRef, runConfig, 'boExperientAutoConnectRetryDelayTicks', 'bandwidthoptimizer.experient.autoConnectRetryDelayTicks')
            applyOptionalNeoForgeRunProperty(projectRef, runConfig, 'boExperientAutoConnectRejoinCycles', 'bandwidthoptimizer.experient.autoConnectRejoinCycles')
            applyOptionalNeoForgeRunProperty(projectRef, runConfig, 'boExperientAutoConnectRejoinConnectedTicks', 'bandwidthoptimizer.experient.autoConnectRejoinConnectedTicks')
            applyOptionalNeoForgeRunProperty(projectRef, runConfig, 'boExperientAutoConnectRejoinDelayTicks', 'bandwidthoptimizer.experient.autoConnectRejoinDelayTicks')
        }
        applyOptionalNeoForgeRunProperty(projectRef, runConfig, 'boExperientServerCommand', 'bandwidthoptimizer.experient.serverCommand')
        applyOptionalNeoForgeRunProperty(projectRef, runConfig, 'boExperientServerCommandDelayTicks', 'bandwidthoptimizer.experient.serverCommandDelayTicks')
    }
    applySharedBandwidthOptimizerNeoForgeRunProperties(projectRef, runConfig)
    applyOptionalNeoForgeRunProperty(projectRef, runConfig, 'boClientChunkCacheMaxMemoryMb', 'bandwidthoptimizer.clientChunkCacheMaxMemoryMb')
    applyOptionalNeoForgeRunProperty(projectRef, runConfig, 'boClientChunkCacheRecycleTriggerFreeMb', 'bandwidthoptimizer.clientChunkCacheRecycleTriggerFreeMb')
}

def configureBandwidthOptimizerNeoForgeServerRun = { Project projectRef, def runConfig ->
    runConfig.systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
    runConfig.systemProperty('bandwidthoptimizer.outputDirectory', project.ext.boServerOutputRoot.call(projectRef).absolutePath)
    runConfig.systemProperty('bandwidthoptimizer.sharedOutputDirectory', project.ext.boServerOutputRoot.call(projectRef).absolutePath)
    if ((projectRef.findProperty('boExperientEnabled') ?: 'false').toString().toBoolean()) {
        runConfig.systemProperty('bandwidthoptimizer.experient.enabled', 'true')
    }
    applyOptionalNeoForgeRunProperty(projectRef, runConfig, 'boExperientServerCommand', 'bandwidthoptimizer.experient.serverCommand')
    applyOptionalNeoForgeRunProperty(projectRef, runConfig, 'boExperientServerCommandDelayTicks', 'bandwidthoptimizer.experient.serverCommandDelayTicks')
    applySharedBandwidthOptimizerNeoForgeRunProperties(projectRef, runConfig)
}

