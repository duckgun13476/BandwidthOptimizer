            if (!transportEnabled) {
                println 'runAllAutoExitCompare: 当前显式透传 boExperimentalTransport=false；这一轮仍会做 jsonl 抓包/compare，但透明 transport 会保持关闭。'
                println 'runAllAutoExitCompare: 如果要恢复默认开启，请移除该参数，或显式传 -PboExperimentalTransport=true'
            }

            println 'runAllAutoExitCompare: 正在启动本地测试服务端。'
            serverProcess = startExistingRunTaskProcess(projectDirFile, isWindows, wrapperPath, 'runServer', buildRunAllSharedGradleArgs(project), null, serverTaskLog, 'runServer')
            waitForLogMarker(
                    serverTaskLog,
                    ['Done ('],
                    ['BUILD FAILED', 'Failed to start the minecraft server', 'Perhaps a server is already running on that port', 'Address already in use'],
                    180000L,
                    '服务端启动'
            )

            List<String> clientGradleArgs = buildExperientAutoConnectGradleArgs(project, '127.0.0.1:25565', 'BO RunAll AutoExit', 20L)

            println 'runAllAutoExitCompare: 服务端已就绪，正在启动客户端，并由 experient 自动发起单次直连 127.0.0.1:25565。'
            clientProcess = startExistingRunTaskProcess(
                    projectDirFile,
                    isWindows,
                    wrapperPath,
                    'runClient',
                    clientGradleArgs,
                    null,
                    clientTaskLog,
                    'runClient'
            )

            waitForLogMarker(
                    clientTaskLog,
                    ['Connecting to 127.0.0.1, 25565', 'Connecting to 127.0.0.1:25565'],
                    ['Failed to connect to the server', 'disconnect.genericReason', 'Connection refused', 'Internal Exception'],
                    180000L,
                    '客户端连接'
            )

            println "runAllAutoExitCompare: 正在等待退出触发条件 ${exitTrigger}。"
            waitForRunAllAutoExitTrigger(
                    exitTrigger,
                    serverLoginMarker,
                    clientSendJsonl,
                    clientReceiveJsonl,
                    serverSendJsonl,
                    serverReceiveJsonl,
                    triggerTimeoutMillis
            )

            if (exitDelaySeconds > 0L) {
                println "runAllAutoExitCompare: 已命中退出条件，${exitDelaySeconds} 秒后强制结束客户端和服务端。"
                sleep(exitDelaySeconds * 1000L)
            } else {
                println 'runAllAutoExitCompare: 已命中退出条件，正在强制结束客户端和服务端。'
            }

            forceStopRunAllProcesses(project, projectDirFile, isWindows, [serverProcess, clientProcess])
            waitForFilesToSettle(
                    [serverSendJsonl, serverReceiveJsonl, clientSendJsonl, clientReceiveJsonl, serverChunkHotspotStats, clientChunkHotspotStats],
                    settleMillis,
                    settleTimeoutMillis
            )

            println 'runAllAutoExitCompare: jsonl 已稳定，正在执行 compare。'
            runChannelJsonlCompareNow(project)
        } finally {
            forceStopRunAllProcesses(project, projectDirFile, isWindows, [serverProcess, clientProcess])
        }
    }
}

tasks.register('PublishInfo') {
    group = 'Publishing'
    description = 'Prints local publishing configuration and token availability.'
    doLast {
        println "Reobfuscated JAR file path: ${tasks.named('jar', Jar).get().archiveFile.get().asFile.absolutePath}"
        println "version = \"${minecraft_version}-${mod_version}\""
        println "displayName = \"${mod_name} v${mod_version} for Forge ${minecraft_version}\""
        println "curseforge_id = ${curseforge_id}"
        println "modrinth_id = ${modrinth_id}"
        String changelogEntry = currentVersionChangelogEntry()
        if (changelogEntry == null || changelogEntry.isBlank()) {
            println "\u001B[31mMissing changelog entry for ${mod_version} in ${changelogFile().absolutePath}\u001B[0m"
            throw new GradleException("Missing changelog entry for ${mod_version}")
        }
        println "changelog ="
        println changelogEntry
        Properties apiProperties = loadApiProperties()
        println "CF_TOKEN present: ${apiProperties.getProperty('CF_TOKEN') != null}"
        println "MODRINTH_TOKEN present: ${apiProperties.getProperty('MODRINTH_TOKEN') != null}"
    }
}

tasks.register('publishAll') {
    group = 'Publishing'
    description = 'Publishes the current build to CurseForge and Modrinth.'
    dependsOn 'publishCurseForge'
    dependsOn 'publishMods'
}

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    group = 'Publishing'
    description = 'Publishes the current build to CurseForge.'
    dependsOn 'reobfJar'
    onlyIf {
        hasPublishValue(curseforge_id)
                && loadApiProperties().getProperty('CF_TOKEN') != null
                && changelogFile().exists()
    }

    apiToken = loadApiProperties().getProperty('CF_TOKEN')
    def mainFile = upload(curseforge_id, tasks.named('jar', Jar).get().archiveFile.get().asFile)
    mainFile.changelog = fullChangelogText()
    mainFile.addEnvironment('Client', 'Server')
    mainFile.addGameVersion("${minecraft_version}")
    mainFile.addModLoader('Forge')
    mainFile.displayName = "${mod_name} v${mod_version} for Forge ${minecraft_version}"
    mainFile.releaseType = publish_version
    disableVersionDetection()
}

publishMods {
    def modrinthToken = loadApiProperties().getProperty('MODRINTH_TOKEN')

    file = tasks.named('jar', Jar).get().archiveFile
    changelog = fullChangelogText()
    type = publish_version == 'alpha' ? ALPHA : (publish_version == 'beta' ? BETA : STABLE)
    version = "${minecraft_version}-${mod_version}"
    displayName = "${mod_name} v${mod_version} for Forge ${minecraft_version}"
    modLoaders.add('forge')

    if (modrinthToken != null && hasPublishValue(modrinth_id)) {
        modrinth {
            accessToken = modrinthToken
            projectId = "${modrinth_id}"
            minecraftVersions.add(minecraft_version)
        }
    }
}

tasks.named('publishMods') {
    dependsOn 'reobfJar'
    onlyIf {
        hasPublishValue(modrinth_id)
                && loadApiProperties().getProperty('MODRINTH_TOKEN') != null
                && changelogFile().exists()
    }
}

Properties loadApiProperties() {
    Properties properties = new Properties()
    File propertiesFile = file('api.properties')
    if (propertiesFile.exists()) {
        propertiesFile.withInputStream { properties.load(it) }
    }
    return properties
}

File changelogFile() {
    return rootProject.file('update/changelog.md')
}

String firstChangelogEntry() {
    File file = changelogFile()
    if (!file.exists()) {
        return ''
    }
    return file.text.split('\\n\\n\\n')[0]
}

String fullChangelogText() {
    File file = changelogFile()
    if (!file.exists()) {
        return ''
    }
    return file.getText('UTF-8')
}

String currentVersionChangelogEntry() {
    File file = changelogFile()
    if (!file.exists()) {
        return ''
    }

    List<String> lines = file.readLines('UTF-8')
    String targetHeader = "#### v${mod_version}".trim()
    int startIndex = lines.findIndexOf { String line -> line.trim() == targetHeader }
    if (startIndex < 0) {
        return ''
    }

    int endIndex = lines.size()
    for (int index = startIndex + 1; index < lines.size(); index++) {
        if (lines[index].trim().startsWith('#### v')) {
            endIndex = index
            break
        }
    }

    return lines.subList(startIndex, endIndex)
            .dropWhile { String line -> line.trim().isEmpty() }
            .join('\n')
            .trim()
}

boolean hasPublishValue(Object value) {
    String text = String.valueOf(value == null ? '' : value).trim()
    return !text.isEmpty() && !text.equalsIgnoreCase('todo') && !text.equals('0')
}
