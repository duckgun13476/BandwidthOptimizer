buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'net.darkhax.curseforgegradle' version '1.1.24'
    id 'me.modmuss50.mod-publish-plugin' version '0.8.3'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {

        configureEach {
            workingDirectory project.file('run')
            property 'mixin.debug', 'true'
            property 'mixin.debug.export', 'true'
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {

            workingDirectory project.file('run/client')

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id

            // experient 自动化默认关闭，只有测试任务显式传 boExperientEnabled=true 时才注入相关运行时开关。
            if ((project.findProperty('boExperientEnabled') ?: 'false').toString().toBoolean()) {
                property 'bandwidthoptimizer.experient.enabled', 'true'

                // 这个配置只在 experient 自动化测试里打开，用系统属性把客户端引导到唯一一条受控连接。
                if (project.hasProperty('boExperientAutoConnectAddress')) {
                    property 'bandwidthoptimizer.experient.autoConnectAddress', project.property('boExperientAutoConnectAddress').toString()
                    property 'bandwidthoptimizer.experient.autoConnectName', (project.findProperty('boExperientAutoConnectName') ?: 'BandwidthOptimizer Experient').toString()
                    if (project.hasProperty('boExperientAutoConnectDelayTicks')) {
                        property 'bandwidthoptimizer.experient.autoConnectDelayTicks', project.property('boExperientAutoConnectDelayTicks').toString()
                    }
                    if (project.hasProperty('boExperientAutoConnectMaxAttempts')) {
                        property 'bandwidthoptimizer.experient.autoConnectMaxAttempts', project.property('boExperientAutoConnectMaxAttempts').toString()
                    }
                    if (project.hasProperty('boExperientAutoConnectRetryDelayTicks')) {
                        property 'bandwidthoptimizer.experient.autoConnectRetryDelayTicks', project.property('boExperientAutoConnectRetryDelayTicks').toString()
                    }
                }
            }

            // 这组属性把 runAll 透传下来的 transport 实验开关继续桥接到真实游戏进程。
            if (project.hasProperty('boExperimentalTransport')) {
                property 'bandwidthoptimizer.experimentalTransport', project.property('boExperimentalTransport').toString()
            }
            if (project.hasProperty('boExperimentalChunkHotspotTransport')) {
                property 'bandwidthoptimizer.experimentalChunkHotspotTransport', project.property('boExperimentalChunkHotspotTransport').toString()
            }
            if ((project.findProperty('boExperientChunkHotspotPathEnabled') ?: 'false').toString().toBoolean()) {
                property 'bandwidthoptimizer.experient.chunkHotspotPathEnabled', 'true'
            }
            if ((project.findProperty('boExperientChunkHotspotPathStopAfterSection') ?: 'false').toString().toBoolean()) {
                property 'bandwidthoptimizer.experient.chunkHotspotPathStopAfterSection', 'true'
            }
            if ((project.findProperty('boExperientChunkHotspotPathStopAfterBlockEntity') ?: 'false').toString().toBoolean()) {
                property 'bandwidthoptimizer.experient.chunkHotspotPathStopAfterBlockEntity', 'true'
            }
            if (project.hasProperty('boExperientChunkHotspotAckDelayTicks')) {
                property 'bandwidthoptimizer.experient.chunkHotspotAckDelayTicks', project.property('boExperientChunkHotspotAckDelayTicks').toString()
            }
            if (project.hasProperty('boTransportMappingEnabled')) {
                property 'bandwidthoptimizer.transport.mappingEnabled', project.property('boTransportMappingEnabled').toString()
            }
            if (project.hasProperty('boTransportZstdEnabled')) {
                property 'bandwidthoptimizer.transport.zstdEnabled', project.property('boTransportZstdEnabled').toString()
            }
            if (project.hasProperty('boTransportBatchEnabled')) {
                property 'bandwidthoptimizer.transport.batchEnabled', project.property('boTransportBatchEnabled').toString()
            }
            if (project.hasProperty('boTransportBatchWindowMillis')) {
                property 'bandwidthoptimizer.transport.batchWindowMillis', project.property('boTransportBatchWindowMillis').toString()
            }
            if (project.hasProperty('boTransportPacketIdMappingEnabled')) {
