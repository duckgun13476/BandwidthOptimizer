buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'idea'
}

// COMPAT contains local multi-world/runtime regression fixtures, not BO source.
// Keep it out of IntelliJ project analysis while retaining it for manual tests.
idea {
    module {
        excludeDirs += file('COMPAT')
    }
}

allprojects {
    repositories {
        maven {
            name = "PinkCatsMaven"
            url = uri("https://logistics.aisaveworld.tech/d/share/maven/torque")
            content {
                includeGroup "com.pinkcats.torque"
            }
        }
        mavenCentral()
    }

    configurations.configureEach {
        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
    }
}

apply from: rootProject.file('gradle/bo-publishing-root.gradle')
apply from: rootProject.file('gradle/bo-discord-publishing.gradle')

tasks.register('runClientAllVersions') {
    group = 'Development'
    description = 'Root aggregate placeholder for version-specific client runs.'
    dependsOn ':forge-1.19.2:runClient', ':forge-1.20.1:runClient', ':fabric-1.20.1:runClient', ':fabric-1.21.1:runClient', ':neoforge-1.21.1:runClient', ':neoforge-26.1.2:runClient', ':neoforge-26.2:runClient'
}

tasks.register('runServerAllVersions') {
    group = 'Development'
    description = 'Root aggregate placeholder for version-specific server runs.'
    dependsOn ':forge-1.19.2:runServer', ':forge-1.20.1:runServer', ':fabric-1.20.1:runServer', ':fabric-1.21.1:runServer', ':neoforge-1.21.1:runServer', ':neoforge-26.1.2:runServer', ':neoforge-26.2:runServer'
}
