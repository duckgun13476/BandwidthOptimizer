buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'idea'
}

allprojects {
    repositories {
        maven {
            name = "PinkCatsLocal"
            url = uri("C:/F/Maven")
        }
        mavenCentral()
    }

    configurations.configureEach {
        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
    }
}

tasks.register('runClientAllVersions') {
    group = 'Development'
    description = 'Root aggregate placeholder for version-specific client runs.'
    dependsOn ':forge-1.19.2:runClient', ':forge-1.20.1:runClient', ':neoforge-1.21.1:runClient'
}

tasks.register('runServerAllVersions') {
    group = 'Development'
    description = 'Root aggregate placeholder for version-specific server runs.'
    dependsOn ':forge-1.19.2:runServer', ':forge-1.20.1:runServer', ':neoforge-1.21.1:runServer'
}
