def startExistingRunTaskProcess(File projectDir, boolean isWindows, String wrapperPath, String taskName, List<String> extraGradleArgs, String taskArgs, File outputFile, String consoleLabel) {
    outputFile.parentFile.mkdirs()
    if (outputFile.exists()) {
        outputFile.delete()
    }

    List<String> command = []
    if (isWindows) {
        command.addAll(['cmd', '/c', wrapperPath])
    } else {
        command.add(wrapperPath)
    }

    if (extraGradleArgs != null) {
        command.addAll(extraGradleArgs.findAll { it != null && !it.isBlank() })
    }

    command.add(taskName)

    if (taskArgs != null && !taskArgs.isBlank()) {
        command.add("--args=${taskArgs}")
    }

    List<String> normalizedCommand = command.collect { entry -> entry.toString() }
    ProcessBuilder builder = new ProcessBuilder(normalizedCommand)
    builder.directory(projectDir)
    builder.redirectErrorStream(true)
    Process process = builder.start()
    streamRunTaskOutputToConsole(process, outputFile, consoleLabel)
    return process
}


def streamRunTaskOutputToConsole(Process process, File outputFile, String consoleLabel) {
    String safeConsoleLabel = (consoleLabel == null || consoleLabel.isBlank()) ? 'run-task' : consoleLabel
    Thread.startDaemon("runAll-log-pump-${safeConsoleLabel}") {
        BufferedReader reader = new BufferedReader(new InputStreamReader(process.inputStream, StandardCharsets.UTF_8))
        BufferedWriter writer = new BufferedWriter(new OutputStreamWriter(new FileOutputStream(outputFile, true), StandardCharsets.UTF_8))

        try {
            String line
            while ((line = reader.readLine()) != null) {
                synchronized (System.out) {
                    System.out.println("[${safeConsoleLabel}] ${line}")
                }
                writer.write(line)
                writer.newLine()
                writer.flush()
            }
        } finally {
            try {
                reader.close()
            } catch (IOException ignored) {
            }
            try {
                writer.close()
            } catch (IOException ignored) {
            }
        }
    }
}

// 这个函数显式打开 experient 测试功能，避免发布运行时误触发测试自动化。
def buildExperientEnabledGradleArgs() {
    return ['-PboExperientEnabled=true']
}

// 这个函数把 runAll 需要透传给子进程的 transport 实验属性转成 Gradle 参数，避免客户端和服务端看到的开关不一致。
def appendOptionalRunAllProperty(List<String> args, Project projectRef, String propertyName) {
    if (projectRef.hasProperty(propertyName)) {
        args.add("-P${propertyName}=${projectRef.property(propertyName).toString()}")
    }
}

// 这个函数组装 runAll 公共 Gradle 参数，统一包含 experient 和 transport 实验开关。
def buildRunAllSharedGradleArgs(Project projectRef) {
    List<String> args = []
    args.addAll(buildExperientEnabledGradleArgs())
    appendOptionalRunAllProperty(args, projectRef, 'boExperimentalTransport')
    appendOptionalRunAllProperty(args, projectRef, 'boExperimentalChunkHotspotTransport')
    appendOptionalRunAllProperty(args, projectRef, 'boExperientChunkHotspotPathEnabled')
    appendOptionalRunAllProperty(args, projectRef, 'boExperientChunkHotspotPathStopAfterSection')
    appendOptionalRunAllProperty(args, projectRef, 'boExperientChunkHotspotPathStopAfterBlockEntity')
    if (projectRef.hasProperty('boExperientChunkHotspotAckDelayTicks')) {
        appendOptionalRunAllProperty(args, projectRef, 'boExperientChunkHotspotAckDelayTicks')
    } else if ((projectRef.findProperty('boExperientChunkHotspotPathEnabled') ?: 'false').toString().toBoolean()) {
        args.add('-PboExperientChunkHotspotAckDelayTicks=40')
    }
    appendOptionalRunAllProperty(args, projectRef, 'boTransportMappingEnabled')
    appendOptionalRunAllProperty(args, projectRef, 'boTransportZstdEnabled')
    appendOptionalRunAllProperty(args, projectRef, 'boTransportBatchEnabled')
    appendOptionalRunAllProperty(args, projectRef, 'boTransportBatchWindowMillis')
    appendOptionalRunAllProperty(args, projectRef, 'boTransportPacketIdMappingEnabled')
    appendOptionalRunAllProperty(args, projectRef, 'boTransportTelemetryDumpFileName')
    appendOptionalRunAllProperty(args, projectRef, 'boChunkGlobalStoreBudgetBytes')
    appendOptionalRunAllProperty(args, projectRef, 'boChunkGlobalStoreMaxVersionsPerChunk')
    return args
}

// 这个函数负责统一判断 runAll 这一轮有没有显式要求打开透明 transport，避免多个任务各自写一套默认值逻辑。
def isRunAllTransportEnabled(Project projectRef) {
    return isRunAllTransportEnabledByDefault(projectRef)
}

// 这个函数负责把 runAll 本轮可能用到的 telemetry dump 文件路径解析出来，便于启动前清理旧残留，避免上一轮统计冒充本轮结果。
def resolveRunAllTransportTelemetryDumpFile(Project projectRef, File runtimeDir) {
    return resolveRunAllTransportTelemetryDumpPath(projectRef, runtimeDir)
}

// 这个函数负责统一判断 runAll 本轮是否显式关闭了透明 transport；默认不传属性时按开启处理，保证开发运行和打包版行为一致。
def isRunAllTransportEnabledByDefault(Project projectRef) {
    if (!projectRef.hasProperty('boExperimentalTransport')) {
        return true
    }
    return projectRef.property('boExperimentalTransport').toString().toBoolean()
}

// 这个函数负责把 runAll 本轮可能用到的 telemetry dump 文件路径解析出来，便于启动前清理旧残留，避免上一轮统计冒充本轮结果。
def resolveRunAllTransportTelemetryDumpPath(Project projectRef, File runtimeDir) {
    String dumpFileName = (projectRef.findProperty('boTransportTelemetryDumpFileName') ?: 'transport-telemetry-dump.properties').toString().trim()
    if (dumpFileName.isEmpty()) {
        return new File(runtimeDir, 'transport-telemetry-dump.properties')
    }
    File dumpFile = new File(dumpFileName)
    return dumpFile.isAbsolute() ? dumpFile : new File(runtimeDir, dumpFileName)
}

// 这个函数把 experient 自动连服需要的 Gradle 属性组装成参数列表，供 runAll 系列重复复用。
def buildExperientAutoConnectGradleArgs(Project projectRef, String address, String serverName, long delayTicks) {
    List<String> args = []
    args.addAll(buildRunAllSharedGradleArgs(projectRef))
    args.addAll([
            "-PboExperientAutoConnectAddress=${address}",
            "-PboExperientAutoConnectName=${serverName}",
            "-PboExperientAutoConnectDelayTicks=${delayTicks}"
    ])
    appendOptionalRunAllProperty(args, projectRef, 'boExperientAutoConnectMaxAttempts')
    appendOptionalRunAllProperty(args, projectRef, 'boExperientAutoConnectRetryDelayTicks')
    return args
}

// 这个函数统一决定 runAll 这一轮是否要在结束时自动执行 chunk 分支覆盖校验；
// 只要开启了热点路径脚本，就默认打开校验，避免分支长期失效却没人发现。
def isRunAllChunkBranchCoverageVerificationEnabled(Project projectRef) {
    if (projectRef.hasProperty('boRunAllVerifyChunkBranches')) {
        return projectRef.property('boRunAllVerifyChunkBranches').toString().toBoolean()
    }
    return (projectRef.findProperty('boExperientChunkHotspotPathEnabled') ?: 'false').toString().toBoolean()
}

// 这个函数直接复用主工程运行时类路径执行 chunk 分支覆盖校验，
// 让 runAll 在真实抓包完成后立刻 fail-fast，而不是再靠人工翻日志。
def runChunkBranchCoverageVerifyNow(Project projectRef) {
    projectRef.javaexec {
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'com.PinkCats.bandwidthoptimizer.experient.RunAllChunkBranchCoverageMain'
    }
}

// 这个函数轮询日志文件，直到命中成功标记、失败标记，或者超时。
def waitForLogMarker(File logFile, List<String> successMarkers, List<String> failureMarkers, long timeoutMillis, String stageLabel) {
    long deadline = System.currentTimeMillis() + timeoutMillis

    while (System.currentTimeMillis() < deadline) {
        if (logFile.exists()) {
            String logText = logFile.getText('UTF-8')
            if (failureMarkers.any { marker -> logText.contains(marker) }) {
                throw new GradleException("${stageLabel} 失败，命中失败标记。请检查 ${logFile.absolutePath}")
            }
            if (successMarkers.any { marker -> logText.contains(marker) }) {
                return
            }
        }
        sleep(1000)
    }

    throw new GradleException("${stageLabel} 超时。请检查 ${logFile.absolutePath}")
}

// 这个函数专门给 runAll 准备一个独立测试世界，避免旧 world 的 session.lock 干扰本次启动。
def configureRunAllServerProperties(File propertiesFile) {
    Properties properties = new Properties()
    if (propertiesFile.exists()) {
        propertiesFile.withInputStream { input ->
            properties.load(input)
        }
    } else {
        propertiesFile.parentFile.mkdirs()
    }

    properties.setProperty('online-mode', 'false')
    properties.setProperty('enforce-secure-profile', 'false')
    properties.setProperty('server-ip', '')
    properties.setProperty('server-port', '25565')
    properties.setProperty('level-name', 'bo-runall-world')

    propertiesFile.withOutputStream { output ->
        properties.store(output, 'BandwidthOptimizer runAll local test server')
    }
}

// 这个函数会停掉当前项目遗留的 runClient / runServer 进程，避免端口和世界锁冲突。
def stopExistingRunAllProcesses(Project projectRef, File projectDirFile, boolean isWindows) {
    if (!isWindows) {
        return
    }

    String escapedProjectDir = projectDirFile.absolutePath.replace("'", "''")
    projectRef.exec {
        commandLine 'powershell', '-NoProfile', '-Command',
                "\$targets = Get-CimInstance Win32_Process | Where-Object { \$_.CommandLine -and \$_.CommandLine -like '*${escapedProjectDir}*' -and (\$_.CommandLine -like '*forgeclientuserdev*' -or \$_.CommandLine -like '*forgeserveruserdev*' -or \$_.CommandLine -like '*gradlew.bat*runClient*' -or \$_.CommandLine -like '*gradlew.bat*runServer*') }; \$targets | ForEach-Object { Stop-Process -Id \$_.ProcessId -Force -ErrorAction SilentlyContinue }"
        ignoreExitValue = true
    }
}

// 这个函数会在客户端退出后停掉当前项目对应的 runServer 进程链，保证服务端跟着客户端一起结束。
def stopRunAllServerProcesses(Project projectRef, File projectDirFile, boolean isWindows) {
    if (!isWindows) {
        return
    }

    String escapedProjectDir = projectDirFile.absolutePath.replace("'", "''")
    projectRef.exec {
        commandLine 'powershell', '-NoProfile', '-Command',
                "\$targets = Get-CimInstance Win32_Process | Where-Object { \$_.CommandLine -and \$_.CommandLine -like '*${escapedProjectDir}*' -and (\$_.CommandLine -like '*forgeserveruserdev*' -or \$_.CommandLine -like '*gradlew.bat*runServer*') }; \$targets | ForEach-Object { Stop-Process -Id \$_.ProcessId -Force -ErrorAction SilentlyContinue }"
        ignoreExitValue = true
    }
}

// 这个函数清掉 runAll 这次启动依赖的探针文件，避免旧内容把 ready / traffic 判定污染掉。
def clearRunAllProbeFiles(List<File> files) {
    files.each { file ->
        if (file.exists()) {
            file.delete()
        }
    }
}

// 这个函数要求四个方向的 jsonl 都出现内容，确认真正形成了双向链路，而不只是客户端单边发起连接。
def waitForFourWayCapturedTraffic(File clientSendJsonl, File clientReceiveJsonl, File serverSendJsonl, File serverReceiveJsonl, long timeoutMillis) {
    long deadline = System.currentTimeMillis() + timeoutMillis
    boolean verifyChunkBranches = false

    while (System.currentTimeMillis() < deadline) {
        long clientSendLength = clientSendJsonl.exists() ? clientSendJsonl.length() : 0L
        long clientReceiveLength = clientReceiveJsonl.exists() ? clientReceiveJsonl.length() : 0L
        long serverSendLength = serverSendJsonl.exists() ? serverSendJsonl.length() : 0L
        long serverReceiveLength = serverReceiveJsonl.exists() ? serverReceiveJsonl.length() : 0L

        if (clientSendLength > 0L && clientReceiveLength > 0L && serverSendLength > 0L && serverReceiveLength > 0L) {
            if (verifyChunkBranches) {
                println 'runAll: 姝ｅ湪鎵ц chunk 鍒嗘敮瑕嗙洊鏍￠獙銆?'
                runChunkBranchCoverageVerifyNow(project)
            }
            if (verifyChunkBranches) {
                println 'runAll: 正在执行 chunk 分支覆盖校验。'
                runChunkBranchCoverageVerifyNow(project)
            }
            return
        }
        sleep(1000)
    }

    throw new GradleException('runAll 超时：四个方向的 jsonl 仍未全部出现内容。')
}

// 这个函数读取 runAllAutoExitCompare 的长整型参数，统一做缺省值和非法值校验。
def readRunAllLongProperty(Project projectRef, String propertyName, long defaultValue) {
    if (!projectRef.hasProperty(propertyName)) {
        return defaultValue
    }

    String rawValue = projectRef.property(propertyName).toString().trim()
    if (rawValue.isEmpty()) {
        return defaultValue
    }

    try {
        long parsedValue = Long.parseLong(rawValue)
        if (parsedValue < 0L) {
            throw new GradleException("${propertyName} 不能是负数，当前值: ${rawValue}")
        }
        return parsedValue
    } catch (NumberFormatException exception) {
        throw new GradleException("${propertyName} 必须是整数，当前值: ${rawValue}", exception)
    }
}

// 这个函数读取自动退出触发条件，避免 task 内部散落字符串判断。
def readRunAllAutoExitTrigger(Project projectRef) {
    String rawValue = projectRef.findProperty('boRunAllExitTrigger')?.toString()?.trim()
    if (rawValue == null || rawValue.isEmpty()) {
        return 'four-way-jsonl'
    }

    if (rawValue == 'server-login' || rawValue == 'four-way-jsonl') {
        return rawValue
    }

    throw new GradleException("boRunAllExitTrigger 只支持 server-login 或 four-way-jsonl，当前值: ${rawValue}")
}

// 这个函数等待服务端写出“玩家已经真正登录完成”的 marker 文件，给自动退出链路一个稳定触发点。
def waitForMarkerFile(File markerFile, long timeoutMillis, String stageLabel) {
    long deadline = System.currentTimeMillis() + timeoutMillis

    while (System.currentTimeMillis() < deadline) {
        if (markerFile.exists() && markerFile.length() > 0L) {
            return
        }
        sleep(500)
    }

    throw new GradleException("${stageLabel} 超时。请检查 ${markerFile.absolutePath}")
}

// 这个函数按照配置好的触发模式等待自动退出条件命中，既支持登录成功，也支持四向 jsonl 全部有内容。
def waitForRunAllAutoExitTrigger(
        String exitTrigger,
        File serverLoginMarker,
        File clientSendJsonl,
        File clientReceiveJsonl,
        File serverSendJsonl,
        File serverReceiveJsonl,
        long timeoutMillis
) {
    if (exitTrigger == 'server-login') {
        waitForMarkerFile(serverLoginMarker, timeoutMillis, 'runAllAutoExitCompare 等待玩家进服')
        return
    }

    if (exitTrigger == 'four-way-jsonl') {
        waitForFourWayCapturedTraffic(clientSendJsonl, clientReceiveJsonl, serverSendJsonl, serverReceiveJsonl, timeoutMillis)
        return
    }

    throw new GradleException("未知的自动退出触发条件: ${exitTrigger}")
}

// 这个函数在强杀后继续观察 jsonl 文件长度，直到一段时间内不再变化，再执行 compare。
def waitForFilesToSettle(List<File> files, long stableMillis, long timeoutMillis) {
    if (files.isEmpty() || stableMillis <= 0L) {
        return
    }

    Map<String, Long> lastSnapshot = files.collectEntries { File file ->
        [(file.absolutePath): file.exists() ? file.length() : -1L]
    }
    long stableSince = System.currentTimeMillis()
    long deadline = System.currentTimeMillis() + timeoutMillis

    while (System.currentTimeMillis() < deadline) {
        sleep(500)

        Map<String, Long> currentSnapshot = files.collectEntries { File file ->
            [(file.absolutePath): file.exists() ? file.length() : -1L]
        }

        if (currentSnapshot == lastSnapshot) {
            if (System.currentTimeMillis() - stableSince >= stableMillis) {
                return
            }
        } else {
            lastSnapshot = currentSnapshot
            stableSince = System.currentTimeMillis()
        }
    }

    throw new GradleException('runAllAutoExitCompare 等待 jsonl 写入稳定超时。')
}

// 这个函数在自动退出后直接复用主类做 compare，保证比较字段和独立命令完全一致。
def runChannelJsonlCompareNow(Project projectRef) {
    projectRef.javaexec {
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'com.PinkCats.bandwidthoptimizer.experient.ChannelJsonlCompareMain'
    }
}

// 这个函数会先杀 runServer / runClient 的真实游戏进程，再兜底结束外层 Gradle wrapper 进程。
def forceStopRunAllProcesses(Project projectRef, File projectDirFile, boolean isWindows, List<Process> processes) {
    stopExistingRunAllProcesses(projectRef, projectDirFile, isWindows)

    processes.findAll { it != null }.each { Process process ->
        if (!process.isAlive()) {
            return
        }

        process.destroy()
        process.waitFor(5L, TimeUnit.SECONDS)

        if (process.isAlive()) {
            process.destroyForcibly()
            process.waitFor(5L, TimeUnit.SECONDS)
        }
    }
}

// 这个函数给 transport 报告任务组装单轮 runAll 参数，统一固定 zstd 和 telemetry dump，并允许场景覆盖其它算法开关。
def buildTransportReportScenarioGradleArgs(Project projectRef, Map<String, String> scenarioProperties) {
    List<String> args = ['--console=plain', '-PboExperimentalTransport=true', '-PboTransportZstdEnabled=true']
    String observeSeconds = projectRef.findProperty('boRunAllObserveSeconds')?.toString()?.trim()
    args.add("-PboRunAllObserveSeconds=${(observeSeconds == null || observeSeconds.isEmpty()) ? '15' : observeSeconds}")
    appendOptionalRunAllProperty(args, projectRef, 'boRunAllSettleMillis')
    appendOptionalRunAllProperty(args, projectRef, 'boRunAllSettleTimeoutMillis')
    args.add("-PboTransportTelemetryDumpFileName=transport-telemetry-dump.properties")

    String batchWindowMillis = projectRef.findProperty('boTransportBatchWindowMillis')?.toString()?.trim()
    if (batchWindowMillis == null || batchWindowMillis.isEmpty()) {
        batchWindowMillis = '10'
    }
    args.add("-PboTransportBatchWindowMillis=${batchWindowMillis}")

    scenarioProperties.each { String key, String value ->
        args.add("-P${key}=${value}")
    }
    return args
}

// 这个函数等待嵌套的 runAll 进程结束；若超时则主动杀掉，避免某个场景卡住整轮对比。
def waitForScenarioProcess(Process process, long timeoutMillis) {
    if (process.waitFor(timeoutMillis, TimeUnit.MILLISECONDS)) {
        return [timedOut: false, exitCode: process.exitValue()]
    }

    process.destroy()
    process.waitFor(5L, TimeUnit.SECONDS)
    if (process.isAlive()) {
        process.destroyForcibly()
        process.waitFor(5L, TimeUnit.SECONDS)
    }
    return [timedOut: true, exitCode: -1]
}

// 这个函数把单轮场景产出的 telemetry dump 复制到报告目录里，避免下一轮 runAll 清理工作目录时把上一轮结果覆盖掉。
def copyScenarioArtifactIfExists(File sourceFile, File targetFile) {
    if (!sourceFile.exists()) {
        return false
    }

    targetFile.parentFile.mkdirs()
    Files.copy(sourceFile.toPath(), targetFile.toPath(), StandardCopyOption.REPLACE_EXISTING)
    return true
}

// 这个函数让 test 包里的默认场景列表先导出成 tsv，后续自动测试任务只需要读取这份清单。
def writeDefaultTransportReportScenarioList(Project projectRef, File scenarioListFile) {
    scenarioListFile.parentFile.mkdirs()
    projectRef.javaexec {
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'com.PinkCats.bandwidthoptimizer.test.ChannelTransportReportScenarioListMain'
        args '--output', scenarioListFile.absolutePath
    }
}

// 这个函数读取 test 包导出的默认场景清单，把每一行转成 Gradle 任务后续要执行的场景定义。
def readTransportReportScenarios(File scenarioListFile) {
    List<String> lines = Files.readAllLines(scenarioListFile.toPath(), StandardCharsets.UTF_8)
    List<Map<String, String>> scenarios = []
    lines.drop(1).each { String line ->
        if (line == null || line.isBlank()) {
            return
        }

        List<String> columns = line.split('\t', -1).toList()
        if (columns.size() < 6) {
            throw new GradleException("Transport report scenario line is invalid: ${line}")
        }

        scenarios.add([
                id                            : columns[0],
                displayName                   : columns[1],
                baseline                      : columns[2],
                boTransportMappingEnabled     : columns[3],
                boTransportBatchEnabled       : columns[4],
                boTransportPacketIdMappingEnabled: columns[5]
        ])
    }
    return scenarios
}

tasks.register('runChannelTransportReport') {
    group = 'verification'
    description = 'Runs multiple transport algorithm scenarios on top of runAll, then dumps a consolidated txt compression report.'

    doLast {
        // 这是 transport 自动测试总入口：依次跑四个固定场景，保留每轮 dump 和控制台日志，最后汇总成一个 txt 报告。
        String osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
        boolean isWindows = osName.contains('windows')
        File projectDirFile = project.projectDir
        String wrapperPath = new File(projectDirFile, isWindows ? 'gradlew.bat' : 'gradlew').absolutePath
        long scenarioTimeoutMillis = readRunAllLongProperty(project, 'boTransportReportScenarioTimeoutMillis', 480000L)
        long scenarioRetryCount = readRunAllLongProperty(project, 'boTransportReportScenarioRetries', 1L)
        File reportDir = project.file('run/transport-report')
        File scenarioListFile = new File(reportDir, 'scenario-defaults.tsv')
        File manifestFile = new File(reportDir, 'scenario-manifest.tsv')
        File reportFile = new File(reportDir, 'transport-algorithm-report.txt')
        File scenarioDumpFileServer = project.file('run/server/transport-telemetry-dump.properties')
        File scenarioDumpFileClient = project.file('run/client/transport-telemetry-dump.properties')

        List<Map<String, String>> scenarios = [
                [id: 'sza', displayName: 'SZA 仅 Zstd', baseline: 'true', boTransportMappingEnabled: 'false', boTransportBatchEnabled: 'false', boTransportPacketIdMappingEnabled: 'false'],
                [id: 'tda_sza', displayName: 'TDA_SZA 模板字典 + Zstd', baseline: 'false', boTransportMappingEnabled: 'true', boTransportBatchEnabled: 'false', boTransportPacketIdMappingEnabled: 'false'],
                [id: 'batch_sza', displayName: 'BATCH_SZA Batch + Zstd', baseline: 'false', boTransportMappingEnabled: 'false', boTransportBatchEnabled: 'true', boTransportPacketIdMappingEnabled: 'false'],
                [id: 'batch_header_sza', displayName: 'BATCH_HM_SZA Batch + 包头映射 + Zstd', baseline: 'false', boTransportMappingEnabled: 'false', boTransportBatchEnabled: 'true', boTransportPacketIdMappingEnabled: 'true']
        ]

        delete(reportDir)
        reportDir.mkdirs()
        writeDefaultTransportReportScenarioList(project, scenarioListFile)
        scenarios = readTransportReportScenarios(scenarioListFile)

        manifestFile.withWriter('UTF-8') { writer ->
            writer.writeLine('id\tdisplayName\tbaseline\tmappingEnabled\tbatchEnabled\tpacketIdMappingEnabled\tlogPath\tserverDumpPath\tclientDumpPath\texitCode\ttimedOut')
        }

        scenarios.each { Map<String, String> scenario ->
            File scenarioLogFile = new File(reportDir, "${scenario.id}.console.log")
            File archivedServerDumpFile = new File(reportDir, "${scenario.id}.server.dump.properties")
            File archivedClientDumpFile = new File(reportDir, "${scenario.id}.client.dump.properties")
            Map<String, Object> scenarioResult = [timedOut: true, exitCode: -1]
            boolean serverDumpCopied = false
            boolean clientDumpCopied = false
            long totalAttempts = scenarioRetryCount + 1L

            for (long attemptIndex = 1L; attemptIndex <= totalAttempts; attemptIndex++) {
                clearRunAllProbeFiles([scenarioLogFile, scenarioDumpFileServer, scenarioDumpFileClient, archivedServerDumpFile, archivedClientDumpFile])

            println "runChannelTransportReport: 正在执行场景 ${scenario.displayName}"
            List<String> scenarioArgs = buildTransportReportScenarioGradleArgs(project, [
                    boTransportMappingEnabled         : scenario.boTransportMappingEnabled,
                    boTransportBatchEnabled           : scenario.boTransportBatchEnabled,
                    boTransportPacketIdMappingEnabled : scenario.boTransportPacketIdMappingEnabled
            ])
            Process scenarioProcess = startExistingRunTaskProcess(
                    projectDirFile,
                    isWindows,
                    wrapperPath,
                    'runAll',
                    scenarioArgs,
                    null,
                    scenarioLogFile,
                    "report-${scenario.id}-attempt${attemptIndex}"
            )
            scenarioResult = waitForScenarioProcess(scenarioProcess, scenarioTimeoutMillis)
            stopExistingRunAllProcesses(project, projectDirFile, isWindows)
            sleep(2000)
            serverDumpCopied = copyScenarioArtifactIfExists(scenarioDumpFileServer, archivedServerDumpFile)
            clientDumpCopied = copyScenarioArtifactIfExists(scenarioDumpFileClient, archivedClientDumpFile)

                if ((scenarioResult.exitCode as int) == 0 && !scenarioResult.timedOut && serverDumpCopied && clientDumpCopied) {
                    break
                }

                if (attemptIndex < totalAttempts) {
                    println "runChannelTransportReport: 场景 ${scenario.displayName} 第 ${attemptIndex} 次未拿到完整结果，准备重试。"
                }
            }

            manifestFile.append(
                    [
                            scenario.id,
                            scenario.displayName,
                            scenario.baseline,
                            scenario.boTransportMappingEnabled,
                            scenario.boTransportBatchEnabled,
                            scenario.boTransportPacketIdMappingEnabled,
                            scenarioLogFile.absolutePath,
                            serverDumpCopied ? archivedServerDumpFile.absolutePath : '',
                            clientDumpCopied ? archivedClientDumpFile.absolutePath : '',
                            scenarioResult.exitCode.toString(),
                            scenarioResult.timedOut.toString()
                    ].join('\t') + System.lineSeparator(),
                    'UTF-8'
            )

            if (scenarioResult.timedOut) {
                println "runChannelTransportReport: 场景 ${scenario.displayName} 超时，结果已记入报告。"
            } else if ((scenarioResult.exitCode as int) != 0) {
                println "runChannelTransportReport: 场景 ${scenario.displayName} 退出码=${scenarioResult.exitCode}，结果已记入报告。"
            }
        }

        project.javaexec {
            classpath = sourceSets.main.runtimeClasspath
            mainClass = 'com.PinkCats.bandwidthoptimizer.test.ChannelTransportCompressionReportMain'
            args '--manifest', manifestFile.absolutePath, '--output', reportFile.absolutePath
        }

        println "runChannelTransportReport: 报告已生成 ${reportFile.absolutePath}"
    }
}

tasks.register('runAll') {
    group = 'application'
    description = 'Starts the Forge server, waits for readiness, then lets the experient client auto-connect once into localhost and verify four-way jsonl traffic.'

    doLast {
        // 这是 runAll 的最终自举流程：清理旧进程、清理旧探针、启动新服务端、自动进服、验证四向抓包。
        String osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
        boolean isWindows = osName.contains('windows')
        File projectDirFile = project.projectDir
        String wrapperPath = new File(projectDirFile, isWindows ? 'gradlew.bat' : 'gradlew').absolutePath
        // 这几个参数专门给 transport 观察窗口使用，便于固定抓包时长后自动收尾。
        long observeSeconds = readRunAllLongProperty(project, 'boRunAllObserveSeconds', 0L)
        long settleMillis = readRunAllLongProperty(project, 'boRunAllSettleMillis', 3000L)
        long settleTimeoutMillis = readRunAllLongProperty(project, 'boRunAllSettleTimeoutMillis', 15000L)
        boolean verifyChunkBranches = isRunAllChunkBranchCoverageVerificationEnabled(project)

        File serverDir = project.file('run/server')
        File clientDir = project.file('run/client')
        File serverLatestLog = project.file('run/server/logs/latest.log')
        File clientLatestLog = project.file('run/client/logs/latest.log')
        File serverTaskLog = project.file('run/runall-server-task.log')
        File clientTaskLog = project.file('run/runall-client-task.log')
        File serverSendJsonl = project.file('run/server/send.jsonl')
        File serverReceiveJsonl = project.file('run/server/receive.jsonl')
        File clientSendJsonl = project.file('run/client/send.jsonl')
        File clientReceiveJsonl = project.file('run/client/receive.jsonl')
        File serverChunkHotspotStats = project.file('run/server/chunk-hotspot-stats.properties')
        File clientChunkHotspotStats = project.file('run/client/chunk-hotspot-stats.properties')
        File serverTransportTelemetryDump = resolveRunAllTransportTelemetryDumpPath(project, serverDir)
        File clientTransportTelemetryDump = resolveRunAllTransportTelemetryDumpPath(project, clientDir)
        File captureResetRequest = project.file('run/bo-runall-capture-reset.request')
        File serverProperties = project.file('run/server/server.properties')
        boolean transportEnabled = isRunAllTransportEnabledByDefault(project)

        stopExistingRunAllProcesses(project, projectDirFile, isWindows)
        sleep(3000)

        clearRunAllProbeFiles([
                serverLatestLog,
                clientLatestLog,
                serverTaskLog,
                clientTaskLog,
                serverSendJsonl,
                serverReceiveJsonl,
                clientSendJsonl,
                clientReceiveJsonl,
                serverChunkHotspotStats,
                clientChunkHotspotStats,
                serverTransportTelemetryDump,
                clientTransportTelemetryDump,
                captureResetRequest
        ])

        configureRunAllServerProperties(serverProperties)

        if (!transportEnabled) {
            println 'runAll: 当前显式透传 boExperimentalTransport=false；本轮仍会分别启动客户端和服务端，但透明 transport 会保持关闭。'
            println 'runAll: 如果要恢复默认开启，请移除该参数，或显式传 -PboExperimentalTransport=true'
        }

        println 'runAll: 正在启动本地测试服务端。'
        Process serverProcess = startExistingRunTaskProcess(projectDirFile, isWindows, wrapperPath, 'runServer', buildRunAllSharedGradleArgs(project), null, serverTaskLog, 'runServer')
        waitForLogMarker(
                serverTaskLog,
                ['Done ('],
                ['BUILD FAILED', 'Failed to start the minecraft server', 'Perhaps a server is already running on that port', 'Address already in use'],
                180000L,
                '服务端启动'
        )

        List<String> clientGradleArgs = buildExperientAutoConnectGradleArgs(project, '127.0.0.1:25565', 'BO RunAll Local', 20L)

        println 'runAll: 服务端已就绪，正在启动客户端，并由 experient 自动发起单次直连 127.0.0.1:25565。'
        Process clientProcess = startExistingRunTaskProcess(
                projectDirFile,
                isWindows,
                wrapperPath,
                'runClient',
                clientGradleArgs,
                null,
                clientTaskLog,
                'runClient'
        )

        waitForLogMarker(
                clientTaskLog,
                ['Connecting to 127.0.0.1, 25565', 'Connecting to 127.0.0.1:25565'],
                ['Failed to connect to the server', 'disconnect.genericReason', 'Connection refused', 'Internal Exception'],
                180000L,
                '客户端连接'
        )

        waitForFourWayCapturedTraffic(
                clientSendJsonl,
                clientReceiveJsonl,
                serverSendJsonl,
                serverReceiveJsonl,
                180000L
        )

        println 'runAll: 四个方向的 jsonl 都已经开始写入。'
        println "服务端目录: ${serverDir.absolutePath}"
        println "客户端目录: ${clientDir.absolutePath}"
        println "服务端外层任务日志: ${serverTaskLog.absolutePath}"
        println "客户端外层任务日志: ${clientTaskLog.absolutePath}"

        if (!serverProcess.isAlive()) {
            println 'runAll: 服务端外层任务进程已退出，请优先查看 run/runall-server-task.log。'
        }
        if (!clientProcess.isAlive()) {
            println 'runAll: 客户端外层任务进程已退出，请优先查看 run/runall-client-task.log。'
        }

        println 'runAll: 正在等待客户端退出，退出后会自动关闭服务端。'
        // 这个分支把 runAll 变成固定观察窗口，给 transport 实验预留一段稳定抓包时间。
        if (observeSeconds > 0L) {
            println "runAll: 正在观察 transport ${observeSeconds} 秒，到时后会强制结束客户端和服务端。"
            sleep(observeSeconds * 1000L)
            forceStopRunAllProcesses(project, projectDirFile, isWindows, [serverProcess, clientProcess])
            waitForFilesToSettle(
                    [serverSendJsonl, serverReceiveJsonl, clientSendJsonl, clientReceiveJsonl, serverChunkHotspotStats, clientChunkHotspotStats],
                    settleMillis,
                    settleTimeoutMillis
            )
            println 'runAll: 观察窗口已经结束，客户端和服务端已被强制关闭。'
            return
        }

        clientProcess.waitFor()
        waitForFilesToSettle(
                [clientSendJsonl, serverReceiveJsonl],
                settleMillis,
                settleTimeoutMillis
        )

        println 'runAll: 检测到客户端已退出，正在关闭服务端。'
        stopRunAllServerProcesses(project, projectDirFile, isWindows)

        if (serverProcess.isAlive()) {
            serverProcess.waitFor(30L, TimeUnit.SECONDS)
        }

        if (verifyChunkBranches) {
            waitForFilesToSettle(
                    [serverSendJsonl, serverReceiveJsonl, clientSendJsonl, clientReceiveJsonl, serverChunkHotspotStats, clientChunkHotspotStats],
                    settleMillis,
                    settleTimeoutMillis
            )
            println 'runAll: 正在执行 chunk 分支覆盖校验。'
            runChunkBranchCoverageVerifyNow(project)
        }

        println 'runAll: 服务端已随客户端退出。'
    }
}

