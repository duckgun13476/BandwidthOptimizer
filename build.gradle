            }
            if (project.hasProperty('boChunkGlobalStoreBudgetBytes')) {
                property 'bandwidthoptimizer.chunkGlobalStoreBudgetBytes', project.property('boChunkGlobalStoreBudgetBytes').toString()
            }
            if (project.hasProperty('boChunkGlobalStoreMaxVersionsPerChunk')) {
