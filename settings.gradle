pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'BandwidthOptimizer'

include 'forge-1.20.1'
include 'neoforge-1.21.1'

project(':forge-1.20.1').projectDir = file('project/forge/1.20.1')
project(':neoforge-1.21.1').projectDir = file('project/neoforge/1.21.1')
