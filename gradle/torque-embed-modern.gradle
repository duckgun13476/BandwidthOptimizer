def embeddedTorqueNotation = project.findProperty('bo_torque_embed_notation')?.toString()?.trim()
if (!embeddedTorqueNotation) {
    throw new GradleException("Missing bo_torque_embed_notation for project '${project.path}'")
}

def embeddedTorqueParts = embeddedTorqueNotation.split(':')
if (embeddedTorqueParts.length < 3) {
    throw new GradleException("Invalid bo_torque_embed_notation '${embeddedTorqueNotation}' for project '${project.path}'")
}

def embeddedTorqueArtifact = embeddedTorqueParts[1]
def embeddedTorqueIsObfuscated = project.hasProperty('bo_torque_embed_is_obfuscated')
        ? project.findProperty('bo_torque_embed_is_obfuscated').toString().toBoolean()
        : embeddedTorqueArtifact.contains('-forge')
def embeddedJarJarNotations = [embeddedTorqueNotation]
def extraEmbeddedJarJarNotations = project.findProperty('bo_extra_jarjar_embed_notations')?.toString()?.trim()
if (extraEmbeddedJarJarNotations) {
    extraEmbeddedJarJarNotations.split(',').collect { it.trim() }.findAll { !it.isEmpty() }.each {
        embeddedJarJarNotations.add(it)
    }
}
def embeddedJarJarEntries = embeddedJarJarNotations.collect { notation ->
    def notationParts = notation.split(':')
    if (notationParts.length < 3) {
        throw new GradleException("Invalid embedded jarjar notation '${notation}' for project '${project.path}'")
    }
    [
            notation    : notation,
            group       : notationParts[0],
            artifact    : notationParts[1],
            version     : notationParts[2],
            isObfuscated: notationParts[1].contains('-forge')
    ]
}
def embeddedTorqueConfiguration = configurations.maybeCreate('boJarJarEmbedded')
def embeddedTorqueOutputDir = layout.buildDirectory.dir('generated/boTorqueJarJar')

embeddedTorqueConfiguration.canBeConsumed = false
embeddedTorqueConfiguration.canBeResolved = true
embeddedTorqueConfiguration.transitive = false

dependencies {
    embeddedJarJarEntries.each { entry ->
        boJarJarEmbedded(entry.notation) {
            changing = true
            transitive = false
        }
    }
}

tasks.register('prepareEmbeddedTorqueApi') {
    inputs.files(embeddedTorqueConfiguration)
    outputs.dir(embeddedTorqueOutputDir)

    doLast {
        def outputRoot = embeddedTorqueOutputDir.get().asFile
        delete(outputRoot)

        def jarJarDir = new File(outputRoot, 'META-INF/jarjar')
        jarJarDir.mkdirs()

        def embeddedFiles = embeddedTorqueConfiguration.files

        copy {
            from embeddedFiles
            into jarJarDir
        }

        def metadata = [
                jars: embeddedJarJarEntries.collect { entry ->
                    def embeddedJar = embeddedFiles.find { file ->
                        file.name.startsWith(entry.artifact + '-') && file.name.endsWith('.jar')
                    }
                    if (embeddedJar == null) {
                        throw new GradleException("Unable to resolve embedded jar for '${entry.notation}'")
                    }
                    [
                               identifier  : [
                                       group   : entry.group,
                                       artifact: entry.artifact
                               ],
                               version     : [
                                       range          : "[${entry.version},)",
                                       artifactVersion: entry.version
                               ],
                               path        : "META-INF/jarjar/${embeddedJar.name}",
                               isObfuscated: entry.artifact == embeddedTorqueArtifact ? embeddedTorqueIsObfuscated : entry.isObfuscated
                       ]
                }
        ]

        new File(jarJarDir, 'metadata.json').setText(
                groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata)),
                'UTF-8'
        )
    }
}

tasks.named('jar').configure {
    dependsOn tasks.named('prepareEmbeddedTorqueApi')
    from(embeddedTorqueOutputDir)
}
