// publish root

def boPublishableProjectPaths = [
        ':forge-1.19.2',
        ':forge-1.20.1',
        ':fabric-1.20.1',
        ':fabric-1.21.1',
        ':neoforge-1.21.1',
        ':neoforge-26.1.2',
        ':neoforge-26.2'
]

gradle.projectsEvaluated {
    Task previousCurseForgeTask = null
    Task previousModrinthTask = null

    boPublishableProjectPaths.collect { rootProject.project(it) }.each { targetProject ->
        Task curseForgeTask = targetProject.tasks.findByName('publishCurseForge')
        Task modrinthTask = targetProject.tasks.findByName('publishModrinth')
        Task publishModsTask = targetProject.tasks.findByName('publishMods')

        if (curseForgeTask != null) {
            if (previousCurseForgeTask != null) {
                curseForgeTask.mustRunAfter(previousCurseForgeTask)
            }
            if (previousModrinthTask != null) {
                curseForgeTask.mustRunAfter(previousModrinthTask)
            }
        }

        if (modrinthTask != null) {
            if (curseForgeTask != null) {
                modrinthTask.mustRunAfter(curseForgeTask)
            }
            if (previousCurseForgeTask != null) {
                modrinthTask.mustRunAfter(previousCurseForgeTask)
            }
            if (previousModrinthTask != null) {
                modrinthTask.mustRunAfter(previousModrinthTask)
            }
        }

        if (publishModsTask != null && modrinthTask != null) {
            publishModsTask.mustRunAfter(modrinthTask)
        }

        if (curseForgeTask != null) {
            previousCurseForgeTask = curseForgeTask
        }
        if (modrinthTask != null) {
            previousModrinthTask = modrinthTask
        }
    }
}

tasks.register('allworkPublishInfoAllVersions') {
    group = 'Allwork'
    description = 'Print publish info for all publishable BandwidthOptimizer versions.'
    dependsOn boPublishableProjectPaths.collect { "${it}:allworkPublishInfo" }
}

tasks.register('publishInfoAllVersions') {
    group = 'Publishing'
    description = 'Print publish info for all publishable BandwidthOptimizer versions.'
    dependsOn 'allworkPublishInfoAllVersions'
}

tasks.register('allworkPublishAllVersions') {
    group = 'Allwork'
    description = 'Publish all publishable BandwidthOptimizer versions.'
    dependsOn 'packageAllVersions'
    dependsOn boPublishableProjectPaths.collect { "${it}:allworkPublishAll" }
}

tasks.register('publishAllVersions') {
    group = 'Publishing'
    description = 'Publish all publishable BandwidthOptimizer versions.'
    dependsOn 'packageAllVersions'
    dependsOn 'allworkPublishAllVersions'
}

tasks.register('allworkPackageAllVersions') {
    group = 'Allwork'
    description = 'Build final jars for all publishable BandwidthOptimizer versions.'
    // Fabric version projects proxy this task into standalone Gradle builds.
    // verifyPublishArtifact already builds the final artifact, so scheduling both
    // aliases would launch duplicate Fabric builds against the same project state.
    dependsOn boPublishableProjectPaths.collect { "${it}:verifyPublishArtifact" }
}

tasks.register('allworkJarJarAllVersions') {
    group = 'Allwork'
    description = 'Alias for allworkPackageAllVersions.'
    dependsOn 'allworkPackageAllVersions'
}

tasks.register('packageAllVersions') {
    group = 'Publishing'
    description = 'Build final jars for all publishable BandwidthOptimizer versions.'
    dependsOn 'allworkPackageAllVersions'
}
