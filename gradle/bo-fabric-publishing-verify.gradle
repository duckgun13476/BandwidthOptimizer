
tasks.register('verifyFabricPublishJarContents') {
    group = 'Publishing'
    description = 'Verify Fabric publish jar contains metadata, mixin config, entrypoint class, TorqueAPI and private zstd-jni runtime resource.'
    dependsOn tasks.named(boReadPublishArtifactTaskName())

    doLast {
        File artifactFile = boReadPublishArtifactFile()
        if (!artifactFile.isFile()) {
            throw new GradleException("Fabric publish artifact does not exist: ${artifactFile.absolutePath}")
        }

        def zipFile = new java.util.zip.ZipFile(artifactFile)
        try {
            Set<String> entries = zipFile.entries().collect { entry -> entry.name } as Set
            List<String> missing = []
            [
                    'fabric.mod.json',
                    'bandwidthoptimizer.mixins.json',
                    'com/PinkCats/bandwidthoptimizer/Bandwidthoptimizer.class',
                    'com/PinkCats/bandwidthoptimizer/BandwidthOptimizerFabricClient.class',
                    'com/PinkCats/bandwidthoptimizer/channel/ChannelTransportNetworkChannel.class',
                    'com/PinkCats/bandwidthoptimizer/channel/ChannelTransportClientReceiver.class'
            ].each { requiredEntry ->
                if (!entries.contains(requiredEntry)) {
                    missing.add(requiredEntry)
                }
            }

            if (entries.contains('fabric.mod.json')) {
                def metadata = new groovy.json.JsonSlurper().parse(zipFile.getInputStream(zipFile.getEntry('fabric.mod.json')))
                def mainEntrypoints = metadata.entrypoints?.main ?: []
                def clientEntrypoints = metadata.entrypoints?.client ?: []
                if (!mainEntrypoints.contains('com.PinkCats.bandwidthoptimizer.Bandwidthoptimizer')) {
                    missing.add('fabric.mod.json main entrypoint Bandwidthoptimizer')
                }
                if (!clientEntrypoints.contains('com.PinkCats.bandwidthoptimizer.BandwidthOptimizerFabricClient')) {
                    missing.add('fabric.mod.json client entrypoint BandwidthOptimizerFabricClient')
                }
            }

            boolean hasTorqueApiJar = entries.any { entryName ->
                entryName.startsWith('META-INF/jars/TorqueAPI-') && entryName.endsWith('.jar')
            }
            if (!hasTorqueApiJar) {
                missing.add('META-INF/jars/TorqueAPI-*.jar')
            }

            if (project.ext.has('minecraft_version') && project.ext.minecraft_version == '1.20.1') {
                def torqueEntry = zipFile.entries().find { entry ->
                    entry.name.startsWith('META-INF/jars/TorqueAPI-1.20.1-fabric-') && entry.name.endsWith('.jar')
                }
                if (torqueEntry == null) {
                    missing.add('META-INF/jars/TorqueAPI-1.20.1-fabric-*.jar')
                } else {
                    File inspectionDir = new File(project.buildDir, 'tmp/verifyFabricPublishJarContents')
                    inspectionDir.mkdirs()
                    File torqueJar = new File(inspectionDir, 'TorqueAPI-1.20.1-fabric.jar')
                    torqueJar.withOutputStream { output ->
                        zipFile.getInputStream(torqueEntry).withCloseable { input -> input.transferTo(output) }
                    }

                    boolean windows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
                    File javap = new File(System.getProperty('java.home'), windows ? 'bin/javap.exe' : 'bin/javap')
                    if (!javap.isFile()) {
                        throw new GradleException("Fabric publish verification requires javap from the active JDK: ${javap.absolutePath}")
                    }

                    ByteArrayOutputStream disassemblyOutput = new ByteArrayOutputStream()
                    def result = project.exec {
                        executable javap.absolutePath
                        args '-classpath', torqueJar.absolutePath, '-c', '-p',
                                'com.pinkcats.torque.layer.fabric.mixin.ChunkMapTrackingMixin'
                        standardOutput = disassemblyOutput
                        errorOutput = disassemblyOutput
                        ignoreExitValue = true
                    }
                    String disassembly = disassemblyOutput.toString('UTF-8')
                    if (result.exitValue != 0 || disassembly.contains(' putfield')) {
                        throw new GradleException(
                                'Fabric publish artifact embeds an invalid Torque ChunkMapTrackingMixin: '
                                        + 'the mixin constructor must not write target ChunkMap fields. '
                                        + "Inspect ${torqueEntry.name} before publishing."
                        )
                    }
                }
            }

            boolean hasZstdJar = entries.any { entryName ->
                entryName.startsWith('META-INF/bandwidthoptimizer/libs/zstd-jni-') && entryName.endsWith('.jar')
            }
            if (!hasZstdJar) {
                missing.add('META-INF/bandwidthoptimizer/libs/zstd-jni-*.jar')
            }

            Set<String> declaredRefmaps = []
            entries.findAll { it.endsWith('.mixins.json') }.each { mixinConfig ->
                def entry = zipFile.getEntry(mixinConfig)
                def json = new groovy.json.JsonSlurper().parse(zipFile.getInputStream(entry))
                if (json.refmap instanceof String && !json.refmap.isBlank()) {
                    declaredRefmaps.add(json.refmap)
                }
            }
            declaredRefmaps.each { refmap ->
                if (!entries.contains(refmap)) {
                    missing.add(refmap)
                }
            }

            if (!missing.isEmpty()) {
                throw new GradleException("Fabric publish artifact is missing required entries: ${missing.join(', ')}")
            }

            println "Verified Fabric publish jar contents for ${project.path}: ${artifactFile.absolutePath}"
        } finally {
            zipFile.close()
        }
    }
}

tasks.named('verifyPublishArtifact').configure {
    dependsOn tasks.named('verifyFabricPublishJarContents')
}

['runAll', 'runAllAutoExitCompare'].each { taskName ->
    tasks.matching { it.name == taskName }.configureEach {
        dependsOn tasks.named('verifyFabricPublishJarContents')
    }
}
