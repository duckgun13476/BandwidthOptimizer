import groovy.json.JsonOutput
import groovy.json.JsonSlurper

import java.nio.charset.StandardCharsets
import java.nio.file.AtomicMoveNotSupportedException
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.security.MessageDigest

ext.boDiscordLatestChangelog = { String text ->
    String normalized = text ?: ''
    if (!normalized.isEmpty() && normalized.charAt(0) == '\uFEFF' as char) {
        normalized = normalized.substring(1)
    }
    def matcher = normalized =~ /(?ms)\A(####\s+v[^\n]+.*?)(?=\n####\s+v|\z)/
    return matcher.find() ? matcher.group(1).trim() : ''
}

ext.boDiscordReleaseId = { String changelog ->
    def matcher = (changelog ?: '') =~ /\A####[ \t]+(v[^\r\n]+)[ \t]*(?:\r?\n|\z)/
    return matcher.find() ? matcher.group(1).trim() : ''
}

ext.boDiscordSha256 = { String text ->
    byte[] digest = MessageDigest.getInstance('SHA-256').digest((text ?: '').getBytes(StandardCharsets.UTF_8))
    return digest.collect { String.format('%02x', it & 0xff) }.join('')
}

ext.boDiscordLedgerFile = {
    return rootProject.file('update/discord-publish-ledger.json')
}

ext.boDiscordReadLedger = { File ledgerFile = boDiscordLedgerFile() ->
    if (!ledgerFile.isFile()) {
        return [schemaVersion: 1, entries: []]
    }
    String text = ledgerFile.getText('UTF-8')
    if (!text.isEmpty() && text.charAt(0) == '\uFEFF' as char) {
        text = text.substring(1)
    }
    def parsed = new JsonSlurper().parseText(text)
    if (!(parsed instanceof Map)) {
        return [schemaVersion: 1, entries: []]
    }
    Map ledger = parsed as Map
    if (!(ledger.entries instanceof Collection)) {
        ledger.entries = []
    }
    return ledger
}

ext.boDiscordWriteLedger = { Map ledger, File ledgerFile = boDiscordLedgerFile() ->
    ledgerFile.parentFile.mkdirs()
    File temporaryFile = new File(ledgerFile.parentFile, ledgerFile.name + '.tmp')
    temporaryFile.setText(JsonOutput.prettyPrint(JsonOutput.toJson(ledger)) + System.lineSeparator(), 'UTF-8')
    try {
        Files.move(
                temporaryFile.toPath(),
                ledgerFile.toPath(),
                StandardCopyOption.REPLACE_EXISTING,
                StandardCopyOption.ATOMIC_MOVE
        )
    } catch (AtomicMoveNotSupportedException ignored) {
        Files.move(temporaryFile.toPath(), ledgerFile.toPath(), StandardCopyOption.REPLACE_EXISTING)
    }
}

ext.boDiscordFindLedgerEntry = { Map ledger, String target, String releaseId, String messageSha256 ->
    return (ledger.entries as Collection)
            .findAll { it instanceof Map }
            .collect { it as Map }
            .find { Map entry ->
                entry.target?.toString() == target
                        && entry.releaseId?.toString() == releaseId
                        && entry.messageSha256?.toString() == messageSha256
            }
}

ext.boDiscordSuccessfulChunkKeys = { Map entry ->
    if (!(entry?.successfulChunks instanceof Collection)) {
        return []
    }
    return (entry.successfulChunks as Collection)
            .findAll { it instanceof Map }
            .collect { it as Map }
            .findAll { Map chunk ->
                chunk.index?.toString()?.isInteger()
                        && chunk.sha256?.toString() ==~ /[0-9a-fA-F]{64}/
            }
            .collect { Map chunk -> "${chunk.index.toString().toInteger()}:${chunk.sha256.toString().toLowerCase(Locale.ROOT)}" }
            .unique()
            .sort()
}

ext.boDiscordRecordAttempt = { Map ledger, Map release, int exitCode, Collection<Map> events, String warning = '' ->
    String target = release.target.toString()
    String releaseId = release.releaseId.toString()
    String messageSha256 = release.messageSha256.toString()
    List<Map> entries = (ledger.entries as Collection)
            .findAll { it instanceof Map }
            .collect { it as Map }
    Map entry = boDiscordFindLedgerEntry(ledger, target, releaseId, messageSha256) as Map
    if (entry == null) {
        entry = [
                target          : target,
                releaseId       : releaseId,
                messageSha256   : messageSha256,
                successfulChunks: [],
                attemptCount    : 0,
                status          : 'pending'
        ]
        entries.add(entry)
        ledger.entries = entries
    }

    Map<String, Map> successfulByKey = [:]
    if (entry.successfulChunks instanceof Collection) {
        (entry.successfulChunks as Collection).findAll { it instanceof Map }.each { Object rawChunk ->
            Map chunk = rawChunk as Map
            if (chunk.index != null && chunk.sha256 != null) {
                successfulByKey["${chunk.index}:${chunk.sha256.toString().toLowerCase(Locale.ROOT)}"] = chunk
            }
        }
    }
    events.findAll { it?.type?.toString() == 'chunk_result' && it.status?.toString() in ['sent', 'skipped'] }.each { Map event ->
        int index = event.index.toString().toInteger()
        String sha256 = event.sha256.toString().toLowerCase(Locale.ROOT)
        String key = "${index}:${sha256}"
        successfulByKey[key] = [
                index      : index,
                sha256     : sha256,
                length     : event.length == null ? null : event.length.toString().toInteger(),
                confirmedAt: new Date().format("yyyy-MM-dd'T'HH:mm:ssXXX")
        ].findAll { it.value != null }
    }

    List<Map> releaseResults = events
            .findAll { it?.type?.toString() == 'release_result' }
            .collect { it as Map }
    Map releaseResult = releaseResults.isEmpty() ? null : releaseResults.last()
    boolean success = exitCode == 0 && releaseResult?.status?.toString() == 'success'
    entry.successfulChunks = successfulByKey.values().sort { Map left, Map right -> (left.index as int) <=> (right.index as int) }
    entry.attemptCount = (entry.attemptCount ?: 0).toString().toInteger() + 1
    entry.lastExitCode = exitCode
    entry.status = success ? 'success' : 'failed'
    entry.chunkCount = releaseResult?.chunkCount == null ? entry.chunkCount : releaseResult.chunkCount
    entry.updatedAt = new Date().format("yyyy-MM-dd'T'HH:mm:ssXXX")
    if (warning?.trim()) {
        entry.lastWarning = warning.trim().take(1000)
    } else {
        entry.remove('lastWarning')
    }
    return entry
}

ext.boDiscordReadStringProperty = { String propertyName, String environmentName, String defaultValue = '' ->
    String propertyValue = project.findProperty(propertyName)?.toString()?.trim()
    if (propertyValue) {
        return propertyValue
    }
    String environmentValue = System.getenv(environmentName)?.trim()
    return environmentValue ?: defaultValue
}

ext.boDiscordPublishingDisabled = {
    String value = boDiscordReadStringProperty('bo_discord_publish_disabled', 'BO_DISCORD_PUBLISH_DISABLED', 'false')
    return value.toLowerCase(Locale.ROOT) in ['1', 'true', 'yes', 'on']
}

ext.boDiscordDefaultProjectDirectory = {
    return System.getProperty('os.name', '').toLowerCase(Locale.ROOT).contains('windows') ? 'C:\\F\\Discord' : ''
}

ext.boDiscordResolveInvocation = { Map overrides = [:] ->
    String projectDirectoryText = overrides.projectDirectory?.toString()
            ?: boDiscordReadStringProperty('bo_discord_project_dir', 'BO_DISCORD_PROJECT_DIR', boDiscordDefaultProjectDirectory())
    File projectDirectory = projectDirectoryText ? new File(projectDirectoryText) : null
    String senderText = overrides.sender?.toString()
            ?: boDiscordReadStringProperty('bo_discord_sender_path', 'BO_DISCORD_SENDER_PATH', '')
    File sender = senderText ? new File(senderText) : (projectDirectory == null ? null : new File(projectDirectory, 'scripts/send_release_log.py'))

    String pythonText = overrides.python?.toString()
            ?: boDiscordReadStringProperty('bo_discord_python_path', 'BO_DISCORD_PYTHON_PATH', '')
    if (!pythonText && projectDirectory != null) {
        File virtualEnvironmentPython = System.getProperty('os.name', '').toLowerCase(Locale.ROOT).contains('windows')
                ? new File(projectDirectory, '.venv/Scripts/python.exe')
                : new File(projectDirectory, '.venv/bin/python')
        if (virtualEnvironmentPython.isFile()) {
            pythonText = virtualEnvironmentPython.absolutePath
        }
    }
    if (!pythonText) {
        pythonText = System.getProperty('os.name', '').toLowerCase(Locale.ROOT).contains('windows') ? 'python' : 'python3'
    }

    return [
            projectDirectory: projectDirectory,
            sender          : sender,
            python          : pythonText,
            target          : overrides.target?.toString()
                    ?: boDiscordReadStringProperty('bo_discord_target', 'BO_DISCORD_TARGET', 'bandwidth')
    ]
}

ext.boDiscordRecordUnavailable = { Map release, File ledgerFile, int exitCode, String warning ->
    Map ledger = boDiscordReadLedger(ledgerFile) as Map
    Map event = [
            type         : 'release_result',
            status       : 'unavailable',
            target       : release.target,
            messageSha256: release.messageSha256,
            chunkCount   : 0,
            exitCode     : exitCode
    ]
    Map entry = boDiscordRecordAttempt(ledger, release, exitCode, [event], warning) as Map
    boDiscordWriteLedger(ledger, ledgerFile)
    return entry
}

ext.boDiscordInvokeRelease = { Map release, File ledgerFile = boDiscordLedgerFile(), Map overrides = [:] ->
    Map ledger = boDiscordReadLedger(ledgerFile) as Map
    Map entry = boDiscordFindLedgerEntry(
            ledger,
            release.target.toString(),
            release.releaseId.toString(),
            release.messageSha256.toString()
    ) as Map
    if (entry?.status?.toString() == 'success') {
        return [status: 'already_published', exitCode: 0, entry: entry, warning: '']
    }

    Map invocation = boDiscordResolveInvocation(overrides) as Map
    File projectDirectory = invocation.projectDirectory as File
    File sender = invocation.sender as File
    if (projectDirectory == null || !projectDirectory.isDirectory()) {
        String warning = "Discord project directory is unavailable: ${projectDirectory?.absolutePath ?: 'not configured'}"
        return [status: 'unavailable', exitCode: 127, entry: boDiscordRecordUnavailable(release, ledgerFile, 127, warning), warning: warning]
    }
    if (sender == null || !sender.isFile()) {
        String warning = "Discord sender is unavailable: ${sender?.absolutePath ?: 'not configured'}"
        return [status: 'unavailable', exitCode: 127, entry: boDiscordRecordUnavailable(release, ledgerFile, 127, warning), warning: warning]
    }

    File messageFile = new File(rootProject.buildDir, "tmp/discord-publish/${release.messageSha256}.md")
    messageFile.parentFile.mkdirs()
    messageFile.setText(release.message.toString() + System.lineSeparator(), 'UTF-8')

    List<String> command = [
            invocation.python.toString(),
            sender.absolutePath,
            '--target', invocation.target.toString(),
            '--file', messageFile.absolutePath,
            '--result-json'
    ]
    boDiscordSuccessfulChunkKeys(entry).each { String key ->
        command.add('--skip-chunk')
        command.add(key)
    }

    List<String> outputLines = []
    List<Map> events = []
    int exitCode
    try {
        ProcessBuilder processBuilder = new ProcessBuilder(command as String[])
        processBuilder.directory(projectDirectory)
        processBuilder.redirectErrorStream(true)
        Process process = processBuilder.start()
        process.inputStream.withReader('UTF-8') { reader ->
            reader.eachLine { String line ->
                outputLines.add(line)
                if (line.trim().startsWith('{')) {
                    try {
                        def parsed = new JsonSlurper().parseText(line)
                        if (parsed instanceof Map) {
                            events.add(parsed as Map)
                        }
                    } catch (Exception ignored) {
                        // Non-protocol output remains available in the warning summary.
                    }
                }
            }
        }
        exitCode = process.waitFor()
    } catch (Exception exception) {
        String warning = "Discord sender could not be executed: ${exception.class.simpleName}: ${exception.message}"
        return [status: 'unavailable', exitCode: 126, entry: boDiscordRecordUnavailable(release, ledgerFile, 126, warning), warning: warning]
    }

    String outputSummary = outputLines.findAll { !it.trim().isEmpty() }.takeRight(8).join(' | ').take(1000)
    String warning = exitCode == 0 ? '' : "Discord sender exited with code ${exitCode}${outputSummary ? ": ${outputSummary}" : ''}"
    ledger = boDiscordReadLedger(ledgerFile) as Map
    entry = boDiscordRecordAttempt(ledger, release, exitCode, events, warning) as Map
    boDiscordWriteLedger(ledger, ledgerFile)
    return [status: entry.status, exitCode: exitCode, entry: entry, warning: warning, events: events]
}

tasks.register('publishDiscordRelease') {
    group = 'Publishing'
    description = 'Publishes the latest changelog section to Discord after all version uploads.'
    dependsOn 'allworkPublishAllVersions'

    doLast {
        if (boDiscordPublishingDisabled()) {
            logger.lifecycle('Discord release notification is disabled by configuration.')
            return
        }

        try {
            File changelogFile = rootProject.file('update/changelog.md')
            if (!changelogFile.isFile()) {
                logger.warn('[BO Publish] Discord notification skipped: update/changelog.md is missing. Platform publishing remains successful.')
                return
            }
            String latestChangelog = boDiscordLatestChangelog(changelogFile.getText('UTF-8'))
            String releaseId = boDiscordReleaseId(latestChangelog)
            if (!latestChangelog || !releaseId) {
                logger.warn('[BO Publish] Discord notification skipped: the latest changelog section could not be parsed. Platform publishing remains successful.')
                return
            }

            Map release = [
                    target       : boDiscordReadStringProperty('bo_discord_target', 'BO_DISCORD_TARGET', 'bandwidth'),
                    releaseId    : releaseId,
                    messageSha256: boDiscordSha256(latestChangelog),
                    message      : latestChangelog
            ]
            Map result = boDiscordInvokeRelease(release) as Map
            if (result.status == 'success') {
                logger.lifecycle("Discord release notification completed: release=${releaseId}, chunks=${result.entry.chunkCount ?: result.entry.successfulChunks?.size() ?: 0}")
            } else if (result.status == 'already_published') {
                logger.lifecycle("Discord release notification already recorded: release=${releaseId}")
            } else {
                logger.warn("[BO Publish] Discord notification was not completed: ${result.warning ?: "status=${result.status}, exitCode=${result.exitCode}"}. Platform publishing remains successful.")
            }
        } catch (Exception exception) {
            logger.warn("[BO Publish] Discord notification failed unexpectedly: ${exception.class.simpleName}: ${exception.message}. Platform publishing remains successful.")
        }
    }
}

tasks.named('publishAllVersions').configure {
    dependsOn 'publishDiscordRelease'
}

tasks.register('testDiscordPublishSupport') {
    group = 'Verification'
    description = 'Tests Discord changelog extraction and publish ledger recovery without network access.'

    doLast {
        String sample = '#### v9.8.7-beta\n\n1. Latest.\n\n#### v1.0.0-release\n\n1. Old.'
        String latest = boDiscordLatestChangelog(sample)
        assert latest == '#### v9.8.7-beta\n\n1. Latest.'
        assert boDiscordReleaseId(latest) == 'v9.8.7-beta'
        String messageSha256 = boDiscordSha256(latest)
        assert messageSha256 ==~ /[0-9a-f]{64}/

        Map ledger = [schemaVersion: 1, entries: []]
        Map release = [target: 'bandwidth', releaseId: 'v9.8.7-beta', messageSha256: messageSha256]
        Map first = boDiscordRecordAttempt(ledger, release, 1, [[
                type: 'chunk_result', status: 'sent', index: 1, length: 2000, sha256: 'a' * 64
        ], [
                type: 'release_result', status: 'failed', chunkCount: 2, exitCode: 1
        ]], 'simulated failure')
        assert first.status == 'failed'
        assert boDiscordSuccessfulChunkKeys(first) == ["1:${'a' * 64}"]

        Map second = boDiscordRecordAttempt(ledger, release, 0, [[
                type: 'chunk_result', status: 'skipped', index: 1, length: 2000, sha256: 'a' * 64
        ], [
                type: 'chunk_result', status: 'sent', index: 2, length: 12, sha256: 'b' * 64
        ], [
                type: 'release_result', status: 'success', chunkCount: 2, exitCode: 0
        ]])
        assert second.status == 'success'
        assert second.attemptCount == 2
        assert boDiscordSuccessfulChunkKeys(second) == ["1:${'a' * 64}", "2:${'b' * 64}"]

        File ledgerFile = new File(temporaryDir, 'discord-publish-ledger.json')
        boDiscordWriteLedger(ledger, ledgerFile)
        Map reloaded = boDiscordReadLedger(ledgerFile) as Map
        Map reloadedEntry = boDiscordFindLedgerEntry(reloaded, 'bandwidth', 'v9.8.7-beta', messageSha256) as Map
        assert reloadedEntry.status == 'success'
        assert boDiscordSuccessfulChunkKeys(reloadedEntry) == ["1:${'a' * 64}", "2:${'b' * 64}"]
    }
}

tasks.register('testDiscordPublishSoftFailure') {
    group = 'Verification'
    description = 'Verifies that a missing Discord API target is journaled without failing Gradle.'
    dependsOn 'testDiscordPublishSupport'

    doLast {
        String message = '#### v0.0.0-test\n\n1. No network request should be made.'
        String target = '__bo_missing_test_target__'
        Map release = [
                target       : target,
                releaseId    : 'v0.0.0-test',
                messageSha256: boDiscordSha256(message),
                message      : message
        ]
        File ledgerFile = new File(temporaryDir, 'discord-soft-failure-ledger.json')
        Map result = boDiscordInvokeRelease(release, ledgerFile, [target: target]) as Map
        assert result.exitCode in [2, 126, 127]
        assert result.status in ['failed', 'unavailable']
        Map ledger = boDiscordReadLedger(ledgerFile) as Map
        Map entry = boDiscordFindLedgerEntry(ledger, target, 'v0.0.0-test', release.messageSha256.toString()) as Map
        assert entry != null
        assert entry.lastExitCode == result.exitCode
        assert entry.status != 'success'

        File missingLedgerFile = new File(temporaryDir, 'discord-missing-sender-ledger.json')
        File missingProjectDirectory = new File(temporaryDir, 'missing-discord-project')
        Map missingResult = boDiscordInvokeRelease(
                release,
                missingLedgerFile,
                [target: target, projectDirectory: missingProjectDirectory.absolutePath]
        ) as Map
        assert missingResult.exitCode == 127
        assert missingResult.status == 'unavailable'
        Map missingLedger = boDiscordReadLedger(missingLedgerFile) as Map
        Map missingEntry = boDiscordFindLedgerEntry(missingLedger, target, 'v0.0.0-test', release.messageSha256.toString()) as Map
        assert missingEntry.lastExitCode == 127
        assert missingEntry.lastWarning.toString().contains('project directory is unavailable')
    }
}
