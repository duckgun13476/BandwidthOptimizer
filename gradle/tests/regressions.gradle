def compactRefMemoryAgent = tasks.register('compactRefMemoryAgent', Jar) {
    dependsOn tasks.named('testClasses')
    archiveClassifier = 'compact-ref-test-agent'
    from(sourceSets.test.output) { include 'compactrefregression/CompactReferenceMemoryAgent.class' }
    manifest { attributes 'Premain-Class': 'compactrefregression.CompactReferenceMemoryAgent' }
}
['Enabled', 'Disabled'].each { mode ->
    tasks.register('runCompactChunkReference' + mode + 'Regression', JavaExec) {
        configureTestJavaExecTask(delegate, 'verification', 'Verifies compact chunk REF negotiation, bounded lifecycle and exact restoration.',
                'compactrefregression.CompactReferenceRegressionMain')
        systemProperty 'bandwidthoptimizer.compactChunkReferences', (mode == 'Enabled').toString()
        dependsOn compactRefMemoryAgent
        jvmArgs '--add-opens=java.base/java.util=ALL-UNNAMED', '--add-opens=java.base/java.lang=ALL-UNNAMED'
        doFirst { jvmArgs '-javaagent:' + compactRefMemoryAgent.get().archiveFile.get().asFile.absolutePath }
        if (mode == 'Disabled') args 'disabled'
    }
}

