// Isolated, opt-in native game acceptance. Fixture classes never enter the main jar.
gradle.beforeProject { p ->
    if(p.path != ':neoforge-1.21.1') return
    p.afterEvaluate {
        def root=gradle.rootProject.projectDir.canonicalFile
        def base=root.toPath().resolve(gradle.startParameter.projectProperties['networkProbeExperimentBase'] ?: '.tmp/network-probe-native').toFile().canonicalFile
        if(!base.toPath().startsWith(root.toPath())) throw new GradleException('Outside fixture root')
        def fixture=p.sourceSets.create('networkProbeDev')
        fixture.java.setSrcDirs([new File(p.projectDir,'src/networkProbeDev/java')])
        fixture.resources.setSrcDirs([new File(p.projectDir,'src/networkProbeDev/resources')])
        fixture.compileClasspath += p.sourceSets.main.compileClasspath + p.sourceSets.main.output
        fixture.runtimeClasspath += p.sourceSets.main.runtimeClasspath
        p.extensions.getByName('neoForge').mods.create('networkprobeacceptance') { sourceSet fixture }
        ['server','client'].each { side ->
            def run=p.extensions.getByName('neoForge').runs.getByName(side)
            def role=side=='server' ? (gradle.startParameter.projectProperties['networkProbeServerSide'] ?: 'server') : side
            run.gameDirectory.set(new File(base,role))
            run.systemProperty('networkprobe.root',base.absolutePath)
            run.systemProperty('networkprobe.side',role)
            run.systemProperty('networkprobe.lifecycle',gradle.startParameter.projectProperties['networkProbeLifecycle'] ?: 'false')
            run.systemProperty('networkprobe.policy',gradle.startParameter.projectProperties['networkProbePolicy'] ?: '')
            if(side=='server' && gradle.startParameter.projectProperties['networkProbePolicy']=='unsupported') run.systemProperty('networkprobe.noCapability','true')
            if(side=='server' && gradle.startParameter.projectProperties['networkProbePolicy']=='disabled') run.systemProperty('bandwidthoptimizer.networkProbe.clientRequests','false')
            run.systemProperty('networkprobe.faultReset',gradle.startParameter.projectProperties['networkProbeFaultReset'] ?: 'false')
            run.systemProperty('networkprobe.clientRequest',gradle.startParameter.projectProperties['networkProbeClientRequest'] ?: 'false')
            run.systemProperty('networkprobe.overviewReplay',gradle.startParameter.projectProperties['networkProbeOverviewReplay'] ?: 'false')
            run.systemProperty('bandwidthoptimizer.outputDirectory',new File(base,role+'/bandwidthoptimizer-native').absolutePath)
            run.systemProperty('bandwidthoptimizer.sharedOutputDirectory',new File(base,role+'/bandwidthoptimizer-native').absolutePath)
            run.systemProperty('bandwidthoptimizer.report.uploadEndpoint','')
            run.jvmArgument('-Xmx2G')
        }
        def client=p.extensions.getByName('neoForge').runs.getByName('client')
        client.systemProperty('bandwidthoptimizer.experient.enabled',gradle.startParameter.projectProperties['networkProbeOverviewReplay']=='true'?'false':'true')
        client.systemProperty('bandwidthoptimizer.experient.autoConnectAddress',gradle.startParameter.projectProperties['networkProbeAddress'] ?: '127.0.0.1:25853')
        client.systemProperty('bandwidthoptimizer.experient.autoConnectName','BO network probe acceptance')
        client.programArguments.addAll('--username','NetProbe')
    }
}
