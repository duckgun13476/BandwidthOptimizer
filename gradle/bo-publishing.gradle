ext.boWriteMultipartTextPart = { OutputStream output, String boundary, String name, String content, String contentType ->
    output.write("--${boundary}\r\n".getBytes('UTF-8'))
    output.write("Content-Disposition: form-data; name=\"${name}\"\r\n".getBytes('UTF-8'))
    output.write("Content-Type: ${contentType}\r\n\r\n".getBytes('UTF-8'))
    output.write(content.getBytes('UTF-8'))
    output.write("\r\n".getBytes('UTF-8'))
}

ext.boWriteMultipartFilePart = { OutputStream output, String boundary, String name, File file ->
    output.write("--${boundary}\r\n".getBytes('UTF-8'))
    output.write("Content-Disposition: form-data; name=\"${name}\"; filename=\"${file.name}\"\r\n".getBytes('UTF-8'))
    output.write("Content-Type: application/java-archive\r\n\r\n".getBytes('UTF-8'))
    file.withInputStream { InputStream input ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = input.read(buffer)) > 0) {
            output.write(buffer, 0, read)
        }
    }
    output.write("\r\n".getBytes('UTF-8'))
}

ext.boUploadCurseForgeFile = {
    String token = boReadCurseForgeUploadApiToken()
    if (token == null || token.trim().isEmpty()) {
        throw new GradleException("Missing CF_TOKEN for CurseForge upload in ${project.path}")
    }

    File artifactFile = boVerifyPublishArtifactFile()
    String endpoint = boReadCurseForgeUploadEndpoint()
    String uploadUrl = "${endpoint}/api/projects/${boUrlEncode(curseforge_id.toString())}/upload-file"
    String boundary = "bo-cf-${System.currentTimeMillis()}-${Math.abs(new Random().nextInt())}"
    HttpURLConnection connection = (HttpURLConnection) URI.create(uploadUrl).toURL().openConnection()
    connection.setRequestMethod('POST')
    connection.setConnectTimeout(boPublishHttpTimeoutMillis())
    connection.setReadTimeout(Math.max(boPublishHttpTimeoutMillis(), 180000))
    connection.setDoOutput(true)
    connection.setRequestProperty('X-Api-Token', token.trim())
    connection.setRequestProperty('User-Agent', boPublishUserAgent())
    connection.setRequestProperty('Content-Type', "multipart/form-data; boundary=${boundary}")

    connection.outputStream.withCloseable { OutputStream output ->
        boWriteMultipartTextPart(output, boundary, 'metadata', JsonOutput.toJson(boReadCurseForgeUploadMetadata()), 'application/json; charset=UTF-8')
        boWriteMultipartFilePart(output, boundary, 'file', artifactFile)
        output.write("--${boundary}--\r\n".getBytes('UTF-8'))
    }

    int responseCode = connection.getResponseCode()
    InputStream stream = responseCode >= 400 ? connection.getErrorStream() : connection.getInputStream()
    String body = stream == null ? '' : stream.getText('UTF-8')
    if (responseCode < 200 || responseCode >= 300) {
        String bodySummary = body == null ? '' : body.replaceAll(/\s+/, ' ').take(500)
        throw new GradleException("CurseForge upload failed for ${project.path}: POST ${uploadUrl} returned HTTP ${responseCode}${bodySummary.isEmpty() ? '' : " (${bodySummary})"}")
    }
    return body.trim().isEmpty() ? [:] : new JsonSlurper().parseText(body)
}

tasks.register('PublishInfo') {
    group = 'Publishing'

    doLast {
        println "Publish artifact path: ${boReadPublishArtifactFile().absolutePath}"
        println "version = \"${boReadPublishVersionId()}\"\n" +
                "    displayName = \"${boReadPublishDisplayName()}\""
        def properties = boReadPublishingProperties()
        if (properties != null) {
            println "CF_TOKEN: ${properties.getProperty('CF_TOKEN') == null ? 'missing' : 'present'}"
            println "CurseForge Core API key source: ${boReadCurseForgeApiKeySource() ?: 'missing'}"
            println "MODRINTH_TOKEN: ${properties.getProperty('MODRINTH_TOKEN') == null ? 'missing' : 'present'}"
        } else {
            println "api.properties not exist"
        }
    }
}

tasks.register('checkCurseForgePublishStatus') {
    group = 'Publishing'
    description = 'Checks CurseForge for an existing file matching this publish target.'

    doLast {
        boolean exists = boCheckCurseForgePublished()
        if (boPublishRemoteStatus.curseforgeLedgerIgnored) {
            println "CurseForge publish ledger ignored for ${project.path} because -Pbo_publish_force=true was set."
        } else if (boPublishRemoteStatus.curseforgeLedgerMatch) {
            def match = boPublishRemoteStatus.curseforgeLedgerMatch
            println "CurseForge local ledger has successful upload for ${project.path}; skipping upload. version=${match.versionId} loader=${match.loader} source=${match.source ?: 'ledger'}"
        } else if (boPublishRemoteStatus.curseforgeCheckDisabled) {
            println "CurseForge remote publish check disabled for ${project.path}; no successful local ledger entry found, so upload will be attempted."
        } else if (boPublishRemoteStatus.curseforgeRemoteUnknown) {
            println "CurseForge remote publish check is unavailable for ${project.path}; no successful local ledger entry found, so upload will be attempted. reason=${boPublishRemoteStatus.curseforgeRemoteCheckError ?: 'unknown'}"
        } else if (exists) {
            def match = (boPublishRemoteStatus.curseforgeMatches ?: [[:]])[0]
            println "CurseForge already has ${project.path} target; skipping upload if requested. id=${match.id ?: 'unknown'} displayName=${match.displayName ?: 'unknown'} fileName=${match.fileName ?: 'unknown'} fileStatus=${match.fileStatus ?: 'unknown'}"
        } else {
            println "CurseForge does not have ${project.path} target: displayName=${boReadPublishDisplayName()} fileName=${boReadPublishArtifactFile().name}"
        }
    }
}

tasks.register('checkModrinthPublishStatus') {
    group = 'Publishing'
    description = 'Checks Modrinth for an existing version matching this publish target.'

    doLast {
        boolean exists = boCheckModrinthPublished()
        if (boPublishRemoteStatus.modrinthCheckDisabled) {
            println "Modrinth remote publish check disabled for ${project.path}; upload task will not be skipped by remote status."
        } else if (exists) {
            def match = boPublishRemoteStatus.modrinthMatch ?: [:]
            println "Modrinth already has ${project.path} target; skipping upload if requested. id=${match.id ?: 'unknown'} version=${match.version_number ?: boReadPublishVersionId()} status=${match.status ?: 'unknown'}"
        } else {
            println "Modrinth does not have ${project.path} target: version=${boReadPublishVersionId()}"
        }
    }
}

tasks.register('checkPublishRemoteStatus') {
    group = 'Publishing'
    description = 'Checks remote publishing platforms for existing targets before upload.'
    dependsOn 'checkCurseForgePublishStatus'
    dependsOn 'checkModrinthPublishStatus'
}

tasks.register('publishInfo') {
    group = 'Publishing'
    description = 'Alias for PublishInfo.'
    dependsOn 'PublishInfo'
}

tasks.register('publishAll') {
    dependsOn 'publishCurseForge'
    dependsOn 'publishMods'
    dependsOn 'checkPublishRemoteStatus'
    dependsOn 'verifyPublishArtifact'
    group = 'Publishing'
}

tasks.register('allworkPublishInfo') {
    group = 'Allwork'
    description = 'Allwork alias for PublishInfo.'
    dependsOn 'PublishInfo'
}

tasks.register('allworkPublishAll') {
    group = 'Allwork'
    description = 'Allwork alias for publishAll.'
    dependsOn 'publishAll'
}

tasks.register('allworkJarJar') {
    group = 'Allwork'
    description = 'Allwork alias for the configured final publish artifact task.'
    dependsOn boReadPublishArtifactTaskName()
}

tasks.register('verifyPublishArtifact') {
    group = 'Publishing'
    description = 'Verify that the configured final publish artifact exists before uploading.'
    dependsOn boReadPublishArtifactTaskName()

    doLast {
        File artifactFile = boVerifyPublishArtifactFile()
        println "Verified publish artifact for ${project.path}: ${artifactFile.absolutePath} (${artifactFile.length()} bytes)"
    }
}

tasks.register('publishCurseForge') {
    dependsOn boReadPublishArtifactTaskName()
    dependsOn 'verifyPublishArtifact'
    dependsOn 'checkCurseForgePublishStatus'

    onlyIf {
        boolean exists = boPublishRemoteStatus.containsKey('curseforgeExists')
                ? (boPublishRemoteStatus.curseforgeExists as boolean)
                : boCheckCurseForgePublished()
        if (exists) {
            println "Skipping CurseForge upload for ${project.path}: successful local ledger or remote target already exists. Use -Pbo_publish_force=true to upload anyway."
            return false
        }
        return true
    }

    doLast {
        def response = boUploadCurseForgeFile()
        boWritePublishLedgerSuccessEntry('curseforge', [
                source: 'direct-curseforge-upload',
                fileId: response instanceof Map ? response.id : null
        ])
    }
}

publishMods {
    def properties = boReadPublishingProperties()
    def modrinthTokenGet = properties?.getProperty('MODRINTH_TOKEN')

    file = boReadPublishArtifactFile()
    changelog = boReadFullChangelog()
    type = STABLE
    version = boReadPublishVersionId()
    displayName = boReadPublishDisplayName()

    boReadPublishModrinthLoaders().each { loaderName ->
        modLoaders.add(loaderName)
    }

    if (modrinthTokenGet != null) {
        modrinth {
            accessToken = modrinthTokenGet
            projectId = "${modrinth_id}"
            minecraftVersions.add(minecraft_version)
            boReadPublishRequiredDependencies().each { dependencyId ->
                requires(dependencyId)
            }
            boReadPublishOptionalDependencies().each { dependencyId ->
                optional(dependencyId)
            }
        }
    }
}

tasks.matching { it.name in ['publishMods', 'publishModrinth'] }.configureEach {
    dependsOn boReadPublishArtifactTaskName()
    dependsOn 'verifyPublishArtifact'
    dependsOn 'checkModrinthPublishStatus'

    onlyIf {
        boolean exists = boPublishRemoteStatus.containsKey('modrinthExists')
                ? (boPublishRemoteStatus.modrinthExists as boolean)
                : boCheckModrinthPublished()
        if (exists) {
            println "Skipping Modrinth upload for ${project.path}: remote target already exists. Use -Pbo_publish_force=true to upload anyway."
            return false
        }
        return true
    }
}
