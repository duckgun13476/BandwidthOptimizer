    if ((projectRef.findProperty('boExperientEnabled') ?: 'false').toString().toBoolean()) {
        runConfig.property('bandwidthoptimizer.experient.enabled', 'true')

        if (projectRef.hasProperty('boExperientAutoConnectAddress')) {
            runConfig.property('bandwidthoptimizer.experient.autoConnectAddress', projectRef.property('boExperientAutoConnectAddress').toString())
            runConfig.property('bandwidthoptimizer.experient.autoConnectName', (projectRef.findProperty('boExperientAutoConnectName') ?: 'BandwidthOptimizer Experient').toString())
