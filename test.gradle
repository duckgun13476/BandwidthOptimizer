File resolveBandwidthOptimizerRepositoryRoot() {
    File currentDir = project.projectDir
    while (currentDir != null) {
        File commonGradleFile = new File(currentDir, 'gradle/bo-runall-common.gradle')
        File wrapperFile = new File(currentDir, System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') ? 'gradlew.bat' : 'gradlew')
        if (commonGradleFile.exists() && wrapperFile.exists()) {
            return currentDir
        }
        currentDir = currentDir.parentFile
    }
    return rootProject.projectDir
}

File boRepositoryRootDir = resolveBandwidthOptimizerRepositoryRoot()
apply from: new File(boRepositoryRootDir, 'gradle/bo-runall-common.gradle')

ext.boRepositoryRootDir = boRepositoryRootDir
ext.boRunAllTasksEnabled = project.ext.boIsRunAllTasksEnabled.call(project)
def applyOptionalRunProperty = { Project projectRef, def runConfig, String gradlePropertyName, String runtimePropertyName ->
    if (projectRef.hasProperty(gradlePropertyName)) {
        runConfig.property(runtimePropertyName, projectRef.property(gradlePropertyName).toString())
    }
}

def applyBooleanRunProperty = { Project projectRef, def runConfig, String gradlePropertyName, String runtimePropertyName ->
    if ((projectRef.findProperty(gradlePropertyName) ?: 'false').toString().toBoolean()) {
        runConfig.property(runtimePropertyName, 'true')
    }
}

def applyExperientClientRunProperties = { Project projectRef, def runConfig ->
    if ((projectRef.findProperty('boExperientEnabled') ?: 'false').toString().toBoolean()) {
        runConfig.property('bandwidthoptimizer.experient.enabled', 'true')

        if (projectRef.hasProperty('boExperientAutoConnectAddress')) {
            runConfig.property('bandwidthoptimizer.experient.autoConnectAddress', projectRef.property('boExperientAutoConnectAddress').toString())
            runConfig.property('bandwidthoptimizer.experient.autoConnectName', (projectRef.findProperty('boExperientAutoConnectName') ?: 'BandwidthOptimizer Experient').toString())
            applyOptionalRunProperty(projectRef, runConfig, 'boExperientAutoConnectDelayTicks', 'bandwidthoptimizer.experient.autoConnectDelayTicks')
            applyOptionalRunProperty(projectRef, runConfig, 'boExperientAutoConnectMaxAttempts', 'bandwidthoptimizer.experient.autoConnectMaxAttempts')
            applyOptionalRunProperty(projectRef, runConfig, 'boExperientAutoConnectRetryDelayTicks', 'bandwidthoptimizer.experient.autoConnectRetryDelayTicks')
            applyOptionalRunProperty(projectRef, runConfig, 'boExperientAutoConnectRejoinCycles', 'bandwidthoptimizer.experient.autoConnectRejoinCycles')
            applyOptionalRunProperty(projectRef, runConfig, 'boExperientAutoConnectRejoinConnectedTicks', 'bandwidthoptimizer.experient.autoConnectRejoinConnectedTicks')
            applyOptionalRunProperty(projectRef, runConfig, 'boExperientAutoConnectRejoinDelayTicks', 'bandwidthoptimizer.experient.autoConnectRejoinDelayTicks')
        }

        applyOptionalRunProperty(projectRef, runConfig, 'boExperientClientCommand', 'bandwidthoptimizer.experient.clientCommand')
        applyOptionalRunProperty(projectRef, runConfig, 'boExperientClientCommandDelayTicks', 'bandwidthoptimizer.experient.clientCommandDelayTicks')
        applyOptionalRunProperty(projectRef, runConfig, 'boExperientServerCommand', 'bandwidthoptimizer.experient.serverCommand')
        applyOptionalRunProperty(projectRef, runConfig, 'boExperientServerCommandDelayTicks', 'bandwidthoptimizer.experient.serverCommandDelayTicks')
    }
}

def applyExperientServerRunProperties = { Project projectRef, def runConfig ->
    if ((projectRef.findProperty('boExperientEnabled') ?: 'false').toString().toBoolean()) {
        runConfig.property('bandwidthoptimizer.experient.enabled', 'true')
    }
    applyOptionalRunProperty(projectRef, runConfig, 'boExperientServerCommand', 'bandwidthoptimizer.experient.serverCommand')
    applyOptionalRunProperty(projectRef, runConfig, 'boExperientServerCommandDelayTicks', 'bandwidthoptimizer.experient.serverCommandDelayTicks')
}

