def applyOptionalRunProperty = { Project projectRef, def runConfig, String gradlePropertyName, String runtimePropertyName ->
    if (projectRef.hasProperty(gradlePropertyName)) {
        runConfig.property(runtimePropertyName, projectRef.property(gradlePropertyName).toString())
    }
}

def applyBooleanRunProperty = { Project projectRef, def runConfig, String gradlePropertyName, String runtimePropertyName ->
    if ((projectRef.findProperty(gradlePropertyName) ?: 'false').toString().toBoolean()) {
        runConfig.property(runtimePropertyName, 'true')
    }
}

