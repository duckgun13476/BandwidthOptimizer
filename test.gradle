ext.configureBandwidthOptimizerClientRun = { Project projectRef, def runConfig ->

    runConfig.property('forge.enabledGameTestNamespaces', mod_id)
    runConfig.property('bandwidthoptimizer.outputDirectory', project.ext.boClientOutputRoot.call(projectRef).absolutePath)
    runConfig.property('bandwidthoptimizer.sharedOutputDirectory', project.ext.boServerOutputRoot.call(projectRef).absolutePath)
    applyExperientClientRunProperties(projectRef, runConfig)
    applySharedBandwidthOptimizerRunProperties(projectRef, runConfig)
    applyOptionalRunProperty(projectRef, runConfig, 'boClientChunkCacheMaxMemoryMb', 'bandwidthoptimizer.clientChunkCacheMaxMemoryMb')
    applyOptionalRunProperty(projectRef, runConfig, 'boClientChunkCacheRecycleTriggerFreeMb', 'bandwidthoptimizer.clientChunkCacheRecycleTriggerFreeMb')
    applyOptionalRunProperty(projectRef, runConfig, 'boClientPersistentChunkCache', 'bandwidthoptimizer.clientPersistentChunkCache')
    applyOptionalRunProperty(projectRef, runConfig, 'boClientPersistentChunkCacheManifestRefreshEnabled', 'bandwidthoptimizer.clientPersistentChunkCacheManifestRefreshEnabled')
    applyOptionalRunProperty(projectRef, runConfig, 'boClientPersistentChunkCacheManifestRefreshMillis', 'bandwidthoptimizer.clientPersistentChunkCacheManifestRefreshMillis')
    applyOptionalRunProperty(projectRef, runConfig, 'boClientPersistentChunkCacheManifestRefreshQuietMillis', 'bandwidthoptimizer.clientPersistentChunkCacheManifestRefreshQuietMillis')
    applyOptionalRunProperty(projectRef, runConfig, 'boClientPersistentChunkCacheReadyBytes', 'bandwidthoptimizer.clientPersistentChunkCacheReadyBytes')
}

ext.configureBandwidthOptimizerServerRun = { Project projectRef, def runConfig ->

    runConfig.property('forge.enabledGameTestNamespaces', mod_id)
    runConfig.property('bandwidthoptimizer.outputDirectory', project.ext.boServerOutputRoot.call(projectRef).absolutePath)
    runConfig.property('bandwidthoptimizer.sharedOutputDirectory', project.ext.boServerOutputRoot.call(projectRef).absolutePath)
    applyExperientServerRunProperties(projectRef, runConfig)
    applySharedBandwidthOptimizerRunProperties(projectRef, runConfig)
}

ext.configureTestJavaExecTask = { JavaExec taskRef, String groupName, String taskDescription, String mainClassName ->

    taskRef.group = groupName
    taskRef.description = taskDescription
    taskRef.dependsOn(tasks.named('testClasses'))
    taskRef.classpath = sourceSets.test.runtimeClasspath
    taskRef.mainClass = mainClassName
}


