// run Gradle run mission.
def startExistingRunTaskProcess(File projectDir, boolean isWindows, String wrapperPath, String taskName, List<String> extraGradleArgs, String taskArgs, File outputFile, String consoleLabel) {
    outputFile.parentFile.mkdirs()
    if (outputFile.exists()) {
        outputFile.delete()
    }

    List<String> command = []
    if (isWindows) {
        command.addAll(['cmd', '/c', wrapperPath])
    } else {
        command.add(wrapperPath)
    }
    command.addAll(['-p', projectDir.absolutePath])

    if (extraGradleArgs != null) {
        command.addAll(extraGradleArgs.findAll { it != null && !it.isBlank() })
    }

    command.add(taskName)

    if (taskArgs != null && !taskArgs.isBlank()) {
        command.add("--args=${taskArgs}")
    }

    List<String> normalizedCommand = command.collect { entry -> entry.toString() }
    ProcessBuilder builder = new ProcessBuilder(normalizedCommand)
    builder.directory(new File(wrapperPath).parentFile)
    builder.redirectErrorStream(true)
    Process process = builder.start()
    project.ext.boStreamRunTaskOutputToConsole(process, outputFile, consoleLabel, 'runAll-log-pump')
    return process
}

def buildExperientEnabledGradleArgs() {

    return ['-PboExperientEnabled=true']
}

def removeRunAllPropertiesByPrefix(List<String> args, String propertyPrefix) {

    if (args == null || propertyPrefix == null || propertyPrefix.isBlank()) {
        return
    }
    args.removeAll { String entry ->
        entry != null && entry.startsWith("-P${propertyPrefix}")
    }
}

def upsertRunAllProperty(List<String> args, String propertyName, String propertyValue) {

    if (args == null || propertyName == null || propertyName.isBlank()) {
        return
    }
    removeRunAllPropertiesByPrefix(args, propertyName)
    args.add("-P${propertyName}=${propertyValue}")
}

