def configureRunAllServerProperties(File propertiesFile) {

    Properties properties = new Properties()
    if (propertiesFile.exists()) {
        propertiesFile.withInputStream { input ->
            properties.load(input)
        }
    } else {
        propertiesFile.parentFile.mkdirs()
    }

    properties.setProperty('online-mode', 'false')
    properties.setProperty('enforce-secure-profile', 'false')
    properties.setProperty('server-ip', '')
    properties.setProperty('server-port', '25565')
    properties.setProperty('level-name', 'bo-runall-world')

    propertiesFile.withOutputStream { output ->
        properties.store(output, 'BandwidthOptimizer runAll local test server')
    }

    // runAll 是受控本地验证入口，自动写入 EULA 同意文件，避免新版本运行目录第一次启动时停在原版提示页。
    new File(propertiesFile.parentFile, 'eula.txt').setText('eula=true' + System.lineSeparator(), StandardCharsets.UTF_8.name())
}

def configureRunAllServerOperators(File opsFile) {

    List<Map<String, Object>> opsEntries = []
    if (opsFile.exists()) {
        Object parsed = new JsonSlurper().parse(opsFile, StandardCharsets.UTF_8.name())
        if (parsed instanceof List) {
            opsEntries.addAll((List<Map<String, Object>>) parsed)
        }
    } else {
        opsFile.parentFile.mkdirs()
    }

    Set<String> operatorNames = new LinkedHashSet<>()
    operatorNames.add('Dev')

    File userCacheFile = new File(opsFile.parentFile, 'usercache.json')
    if (userCacheFile.exists()) {
        Object parsedUserCache = new JsonSlurper().parse(userCacheFile, StandardCharsets.UTF_8.name())
        if (parsedUserCache instanceof List) {
            parsedUserCache.each { Object entry ->
                if (entry instanceof Map) {
                    Object rawCachedName = ((Map<?, ?>) entry).get('name')
                    if (rawCachedName == null) {
                        return
                    }
                    String cachedName = rawCachedName.toString()
                    if (cachedName.equalsIgnoreCase('Dev')) {
                        operatorNames.add(cachedName)
                    }
                }
            }
        }
    }

    operatorNames.each { String operatorName ->
        String offlineUuid = UUID.nameUUIDFromBytes(("OfflinePlayer:" + operatorName).getBytes(StandardCharsets.UTF_8)).toString()
        Map<String, Object> operatorEntry = [
                uuid               : offlineUuid,
                name               : operatorName,
                level              : 4,
                bypassesPlayerLimit: false
        ]

        int existingIndex = -1
        for (int index = 0; index < opsEntries.size(); index++) {
            Map<String, Object> existingEntry = opsEntries.get(index)
            if (operatorName.equalsIgnoreCase(String.valueOf(existingEntry.get('name')))) {
                existingIndex = index
                break
            }
        }

        if (existingIndex >= 0) {
            Map<String, Object> mergedEntry = new LinkedHashMap<>(opsEntries.get(existingIndex))
            mergedEntry.putAll(operatorEntry)
            opsEntries.set(existingIndex, mergedEntry)
        } else {
            opsEntries.add(operatorEntry)
        }
    }

    opsFile.setText(
            JsonOutput.prettyPrint(JsonOutput.toJson(opsEntries)) + System.lineSeparator(),
            StandardCharsets.UTF_8.name()
    )
}

def stopExistingRunAllProcesses(Project projectRef, File projectDirFile, boolean isWindows) {

    if (!isWindows) {
        return
    }

    String escapedProjectDir = projectDirFile.absolutePath.replace("'", "''")
    projectRef.exec {
        commandLine 'powershell', '-NoProfile', '-Command',
                "\$targets = Get-CimInstance Win32_Process | Where-Object { \$_.CommandLine -and \$_.CommandLine -like '*${escapedProjectDir}*' -and (\$_.CommandLine -like '*forgeclientuserdev*' -or \$_.CommandLine -like '*forgeserveruserdev*' -or \$_.CommandLine -like '*gradlew.bat*runClient*' -or \$_.CommandLine -like '*gradlew.bat*runServer*' -or \$_.CommandLine -like '*gradle-wrapper.jar*runClient*' -or \$_.CommandLine -like '*gradle-wrapper.jar*runServer*' -or \$_.CommandLine -like '*fabric.dli.env=client*' -or \$_.CommandLine -like '*fabric.dli.env=server*') }; \$targets | ForEach-Object { Stop-Process -Id \$_.ProcessId -Force -ErrorAction SilentlyContinue }"
        ignoreExitValue = true
    }
}

def stopRunAllServerProcesses(Project projectRef, File projectDirFile, boolean isWindows) {

    if (!isWindows) {
        return
    }

    String escapedProjectDir = projectDirFile.absolutePath.replace("'", "''")
