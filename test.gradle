File resolveBandwidthOptimizerRepositoryRoot() {
    File currentDir = project.projectDir
    while (currentDir != null) {
        File commonGradleFile = new File(currentDir, 'gradle/bo-runall-common.gradle')
        File wrapperFile = new File(currentDir, System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') ? 'gradlew.bat' : 'gradlew')
        if (commonGradleFile.exists() && wrapperFile.exists()) {
            return currentDir
        }
        currentDir = currentDir.parentFile
    }
    return rootProject.projectDir
}

