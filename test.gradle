        ])
        appendOptionalRunAllProperty(clientGradleArgs, project, 'boExperientAutoConnectMaxAttempts')
        appendOptionalRunAllProperty(clientGradleArgs, project, 'boExperientAutoConnectRetryDelayTicks')

        Process serverProcess = null
        Process clientProcess = null

        try {
            println "runWatchBoundaryRefreshPatchRegression: exitDelaySeconds=${exitDelaySeconds}, settleMillis=${settleMillis}"
            println 'runWatchBoundaryRefreshPatchRegression: 正在启动本地测试服务端。'
            serverProcess = startExistingRunTaskProcess(
                    projectDirFile,
                    isWindows,
                    wrapperPath,
                    'runServer',
                    sharedGradleArgs,
                    null,
                    serverTaskLog,
                    'runServer'
            )
            waitForLogMarker(
                    serverTaskLog,
                    ['Done ('],
                    ['BUILD FAILED', 'Failed to start the minecraft server', 'Perhaps a server is already running on that port', 'Address already in use'],
                    180000L,
                    '定向回归服务端启动'
            )

            println 'runWatchBoundaryRefreshPatchRegression: 服务端已就绪，正在启动客户端自动进服。'
            clientProcess = startExistingRunTaskProcess(
                    projectDirFile,
                    isWindows,
                    wrapperPath,
                    'runClient',
                    clientGradleArgs,
                    null,
                    clientTaskLog,
                    'runClient'
            )
            waitForLogMarker(
                    clientTaskLog,
                    ['Connecting to 127.0.0.1, 25565', 'Connecting to 127.0.0.1:25565'],
                    ['Failed to connect to the server', 'disconnect.genericReason', 'Connection refused', 'Internal Exception'],
                    180000L,
                    '定向回归客户端连接'
            )

            println 'runWatchBoundaryRefreshPatchRegression: 正在等待 watch-boundary 场景完成 marker。'
            waitForMarkerFile(
                    watchBoundaryMarker,
                    triggerTimeoutMillis,
                    'runWatchBoundaryRefreshPatchRegression 等待 watch-boundary marker'
            )

            if (exitDelaySeconds > 0L) {
                println "runWatchBoundaryRefreshPatchRegression: marker 已命中，${exitDelaySeconds} 秒后强制结束客户端和服务端。"
                sleep(exitDelaySeconds * 1000L)
            } else {
                println 'runWatchBoundaryRefreshPatchRegression: marker 已命中，正在强制结束客户端和服务端。'
            }

            forceStopRunAllProcesses(project, projectDirFile, isWindows, [serverProcess, clientProcess])
            waitForFilesToSettle(
                    [serverSendJsonl, serverReceiveJsonl, clientSendJsonl, clientReceiveJsonl, serverChunkHotspotStats, clientChunkHotspotStats],
                    settleMillis,
                    settleTimeoutMillis
            )

            println 'runWatchBoundaryRefreshPatchRegression: jsonl 已稳定，正在执行定向校验。'
            runWatchBoundaryRefreshPatchVerifyNow(project)
        } finally {
            forceStopRunAllProcesses(project, projectDirFile, isWindows, [serverProcess, clientProcess])
        }
    }
}

