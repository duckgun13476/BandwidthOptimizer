<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BO Stats</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/app.css?v=9">
</head>
<body>
  <header>
    <div class="brand"><strong>BO Stats</strong><span id="report-id"></span></div>
    <nav id="view-tabs" aria-label="报告页面">
      <button type="button" data-view="overview" aria-pressed="true">总览</button>
      <button type="button" data-view="players" aria-pressed="false">玩家</button>
      <button type="button" data-view="details" aria-pressed="false">传输详情</button>
      <button type="button" data-view="packets" aria-pressed="false">包分析</button>
    </nav>
    <div class="header-tools">
      <time id="generated"></time>
      <label for="language" id="language-label">语言</label>
      <select id="language" aria-label="语言">
        <option value="zh-CN">简体中文</option>
        <option value="en-US">English</option>
        <option value="pt-BR">Português (Brasil)</option>
      </select>
    </div>
  </header>
  <main>
    <div id="view-upload" class="upload-page" hidden>
      <section class="upload-shell">
        <div class="page-heading"><div><h1 id="upload-title">上传带宽报告</h1><p id="upload-subtitle">选择 BandwidthOptimizer 生成的报告文件</p></div></div>
        <label id="upload-drop" class="upload-drop" for="upload-file" tabindex="0">
          <span class="upload-mark" aria-hidden="true">↑</span>
          <strong id="upload-prompt">将报告拖到这里</strong>
          <span id="upload-choice">或选择文件</span>
          <small id="upload-hint">JSON 或 Gzip，最大 4 MiB</small>
        </label>
        <input id="upload-file" type="file" accept=".json,.json.gz,.gz,application/json,application/gzip" hidden>
        <div class="upload-selection">
          <div><strong id="upload-file-name">尚未选择文件</strong><span id="upload-file-size"></span></div>
          <button id="upload-submit" type="button" disabled>上传报告</button>
        </div>
        <div id="upload-status" class="upload-status" role="status" hidden></div>
      </section>
    </div>
    <div id="status" role="status">
      <span id="status-text">正在读取报告...</span>
      <button id="retry" type="button" hidden>重试</button>
    </div>
    <div id="view-overview" class="view-page" hidden>
      <section id="overview">
        <div class="page-heading"><div><h1 id="page-title">带宽报告</h1><p id="page-subtitle">服务器带宽使用与优化结果</p></div></div>
        <div class="summary" id="summary"></div>
      </section>
      <section id="trend-section">
        <div class="section-heading trend-heading">
          <div><h2 id="trend-title">小时流量趋势</h2><span id="trend-period"></span></div>
          <div class="trend-controls">
            <label for="trend-player" id="trend-player-label">数据范围</label>
            <select id="trend-player"></select>
          </div>
        </div>
        <div class="trend-panel">
          <div class="legend" id="trend-legend"></div>
          <div class="chart-wrap"><canvas id="traffic-chart" height="260"></canvas></div>
        </div>
      </section>
    </div>
    <div id="view-players" class="view-page" hidden>
      <div class="player-rankings">
        <section class="player-ranking-panel" id="month-section">
          <div class="ranking-panel-heading"><div><h1 id="month-title">月度玩家排行</h1><span id="month-period"></span></div><strong id="month-count"></strong></div>
          <div id="month-players" class="player-ranking-scroll"></div>
        </section>
        <section class="player-ranking-panel" id="current-section">
          <div class="ranking-panel-heading"><div><h1 id="current-title">当前小时</h1><span id="current-period"></span></div><strong id="current-count"></strong></div>
          <div id="current-players" class="player-ranking-scroll"></div>
        </section>
      </div>
    </div>
    <div id="view-details" class="view-page" hidden>
      <section id="details"><div class="page-heading"><div><h1 id="details-title">传输详情</h1><p id="details-subtitle">各压缩阶段与运行状态</p></div></div><div id="sections"></div></section>
    </div>
    <div id="view-packets" class="view-page" hidden>
      <section id="packet-analysis"><div class="page-heading"><div><h1 id="packets-title">包分析</h1><p id="packets-subtitle">旁路来源与包级流量明细</p></div></div><div id="bypass-section"></div></section>
    </div>
  </main>
  <script src="/static/app.js?v=9" defer></script>
</body>
</html>
